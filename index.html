<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070709" />
<title>Message Up</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e11d48'/%3E%3Cpath d='M16 22a6 6 0 0 1 6-6h20a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6H31l-9 8v-8a6 6 0 0 1-6-6z' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #07070a;
  --text: #f4f4f6;
  --muted: #9a9aa6;
  --red: #e11d48;
  --red-2: #ff4d6d;
  --blue: #2f6bff;
  --blue-2: #1f55e0;
  --glass: rgba(255, 255, 255, 0.05);
  --glass-strong: rgba(255, 255, 255, 0.09);
  --border: rgba(255, 255, 255, 0.1);
  --green: #22c55e;
  font-family: 'Poppins', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:disabled { cursor: not-allowed; }

/* ---------- common ---------- */
.splash { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
.spinner {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.15); border-top-color: var(--red-2);
  animation: spin 0.8s linear infinite;
}
.spinner.small { width: 18px; height: 18px; border-width: 2px; border-top-color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }

.setup-card {
  max-width: 520px; padding: 28px; border-radius: 18px;
  background: var(--glass); border: 1px solid var(--border); line-height: 1.6;
}
.setup-card h1 { margin-top: 0; font-size: 22px; }
.setup-card code { background: rgba(255,255,255,.1); padding: 2px 6px; border-radius: 6px; }

.avatar {
  position: relative; flex: none; border-radius: 50%;
  background: linear-gradient(135deg, #3b3b4a, #23232d);
  display: grid; place-items: center; font-weight: 600;
}
.avatar span { position: relative; }
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.online-dot {
  position: absolute; right: 0; bottom: 0; width: 25%; height: 25%; min-width: 9px; min-height: 9px;
  background: var(--green); border: 2px solid #15151b; border-radius: 50%;
}

.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  color: var(--muted); flex: none; transition: background 0.15s, color 0.15s;
}
.icon-btn:hover { background: var(--glass-strong); color: var(--text); }

/* ---------- login ---------- */
.login-page {
  min-height: 100dvh; display: grid; place-items: center; padding: 20px; position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse 80% 55% at 50% 115%, rgba(225, 29, 72, 0.5), transparent 65%),
    radial-gradient(ellipse 60% 40% at 50% -10%, rgba(225, 29, 72, 0.16), transparent 60%),
    #070709;
}
.login-page::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(225, 29, 72, 0.14) 1px, transparent 1px),
    linear-gradient(90deg, rgba(225, 29, 72, 0.14) 1px, transparent 1px);
  background-size: 70px 70px;
  -webkit-mask-image: radial-gradient(ellipse at center, #000 10%, transparent 75%);
  mask-image: radial-gradient(ellipse at center, #000 10%, transparent 75%);
}
.glow-dot {
  position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--red-2);
  box-shadow: 0 0 14px 4px rgba(255, 77, 109, 0.8); animation: pulse 2.6s ease-in-out infinite;
}
.glow-dot.d1 { top: 22%; left: 12%; }
.glow-dot.d2 { bottom: 24%; right: 10%; animation-delay: 0.9s; }
.glow-dot.d3 { top: 14%; right: 24%; animation-delay: 1.6s; }
@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

.login-card {
  position: relative; z-index: 1; width: min(880px, 100%); min-height: 420px;
  display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border-radius: 22px;
  background: rgba(45, 8, 16, 0.55); border: 1px solid rgba(255, 255, 255, 0.12);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.login-left {
  display: flex; flex-direction: column; justify-content: center; padding: 40px 56px 40px 40px;
  background: linear-gradient(135deg, rgba(225, 29, 72, 0.32), rgba(120, 10, 30, 0.1));
  clip-path: polygon(0 0, 100% 0, 84% 100%, 0 100%);
}
.brand-mark {
  width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 18px;
  background: linear-gradient(135deg, var(--red-2), #c9184a); box-shadow: 0 8px 24px rgba(225, 29, 72, 0.45);
}
.login-left h1 { margin: 0 0 10px; font-size: 30px; letter-spacing: 0.5px; }
.login-left p { margin: 0; color: #e7c9cf; font-size: 14px; line-height: 1.6; }

.login-right { display: flex; flex-direction: column; justify-content: center; padding: 40px; }
.login-right h2 { margin: 0 0 4px; font-size: 28px; }
.login-sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
.google-btn {
  display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; height: 50px;
  border-radius: 12px; background: #fff; color: #1f1f1f; font-weight: 600; font-size: 15px;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35); transition: transform 0.15s, box-shadow 0.15s;
}
.google-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(225, 29, 72, 0.35); }
.google-btn:disabled { opacity: 0.75; }
.google-btn .spinner.small { border-color: rgba(0,0,0,.15); border-top-color: #333; }
.form-error {
  margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5;
  background: rgba(225, 29, 72, 0.15); border: 1px solid rgba(225, 29, 72, 0.5); color: #ffc2cd;
}
.login-points { list-style: none; margin: 26px 0 0; padding: 0; display: grid; gap: 8px; color: var(--muted); font-size: 13px; }
.login-points li { display: flex; align-items: center; gap: 8px; }
.login-points svg { color: var(--red-2); }

/* ---------- chat ---------- */
.chat-page {
  height: 100dvh; display: grid; place-items: center; padding: 16px;
  background:
    radial-gradient(ellipse 60% 50% at 20% 0%, rgba(47, 107, 255, 0.18), transparent 60%),
    radial-gradient(ellipse 50% 40% at 100% 100%, rgba(120, 60, 255, 0.14), transparent 60%),
    #0a0a0f;
}
.shell {
  width: min(1180px, 100%); height: min(780px, 100%);
  display: grid; grid-template-columns: 380px minmax(0, 1fr); overflow: hidden; border-radius: 26px;
  background: rgba(24, 24, 32, 0.78); border: 1px solid var(--border);
  -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
}

.sidebar { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--border); padding: 18px 14px 8px; }
.me-row { display: flex; align-items: center; gap: 10px; padding: 0 4px 14px; }
.me-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.me-info strong, .me-info span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-info strong { font-size: 15px; }
.me-info span { font-size: 12px; color: var(--muted); }

.search-box {
  display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border-radius: 12px;
  background: var(--glass); border: 1px solid var(--border); color: var(--muted);
}
.search-box input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: 14px; }
.search-box input::placeholder { color: var(--muted); }
.search-box:focus-within { border-color: rgba(47, 107, 255, 0.7); }

.recent-row { display: flex; gap: 14px; overflow-x: auto; padding: 14px 4px 4px; scrollbar-width: none; }
.recent-row::-webkit-scrollbar { display: none; }
.recent-item { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); width: 52px; }
.recent-item span { max-width: 52px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tabs { display: flex; gap: 6px; margin: 14px 0 6px; padding: 4px; border-radius: 12px; background: var(--glass); }
.tab {
  flex: 1; height: 34px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--muted);
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s, color 0.15s;
}
.tab.active { background: var(--glass-strong); color: var(--text); }

.badge {
  font-style: normal; font-size: 11px; font-weight: 600; min-width: 20px; height: 20px; padding: 0 6px;
  border-radius: 10px; display: inline-grid; place-items: center; background: var(--blue); color: #fff;
}

.list { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
.list-empty { padding: 28px 14px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border-radius: 14px; text-align: left;
  transition: background 0.15s;
}
.row:hover { background: var(--glass); }
.row.active { background: var(--glass-strong); }
.row-main { flex: 1; min-width: 0; }
.row-top, .row-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.row-top strong { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-top time { font-size: 11px; color: var(--muted); flex: none; }
.preview { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preview.unread { color: var(--text); font-weight: 500; }
.row-bottom { margin-top: 2px; }

/* conversation */
.conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: rgba(10, 10, 15, 0.35); }
.conv-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.conv-title { display: flex; flex-direction: column; min-width: 0; }
.conv-title strong { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { font-size: 12px; color: var(--muted); }
.status.on { color: var(--green); }
.back-btn { display: none; }

.messages { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; }
.empty-hint { margin: auto; color: var(--muted); font-size: 14px; }
.day-sep { text-align: center; margin: 14px 0 8px; }
.day-sep span { font-size: 11px; color: var(--muted); padding: 4px 12px; border-radius: 20px; background: var(--glass); }
.msg-row { display: flex; margin: 2px 0; }
.msg-row.mine { justify-content: flex-end; }
.bubble {
  max-width: min(520px, 78%); padding: 9px 13px 6px; border-radius: 18px 18px 18px 6px;
  background: var(--glass-strong); word-break: break-word;
}
.bubble.mine { background: linear-gradient(135deg, var(--blue), var(--blue-2)); border-radius: 18px 18px 6px 18px; }
.bubble p { margin: 0; font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; }
.bubble time { display: block; text-align: right; margin-top: 2px; font-size: 10.5px; color: rgba(255, 255, 255, 0.6); }

.conv-error { margin: 0 18px 8px; padding: 8px 12px; border-radius: 10px; font-size: 13px; background: rgba(225, 29, 72, 0.15); color: #ffc2cd; }
.emoji-panel {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; margin: 0 18px 8px; padding: 8px; border-radius: 14px;
  background: rgba(30, 30, 40, 0.95); border: 1px solid var(--border);
}
.emoji-panel button { font-size: 22px; padding: 4px; border-radius: 8px; }
.emoji-panel button:hover { background: var(--glass-strong); }

.composer { display: flex; align-items: flex-end; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid var(--border); }
.composer textarea {
  flex: 1; min-width: 0; resize: none; max-height: 120px; padding: 11px 16px; border-radius: 22px; font-size: 14.5px;
  background: var(--glass); border: 1px solid var(--border); outline: 0; line-height: 1.4;
}
.composer textarea:focus { border-color: rgba(47, 107, 255, 0.7); }
.send-btn {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: linear-gradient(135deg, var(--blue), var(--blue-2)); color: #fff; transition: opacity 0.15s, transform 0.15s;
}
.send-btn:hover:not(:disabled) { transform: scale(1.06); }
.send-btn:disabled { opacity: 0.4; }

.conv-empty { align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); }
.conv-empty h3 { margin: 14px 0 6px; color: var(--text); font-size: 20px; }
.conv-empty p { margin: 0; max-width: 300px; font-size: 14px; line-height: 1.6; }
.empty-art {
  width: 84px; height: 84px; border-radius: 24px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--blue), #7c3aed); box-shadow: 0 14px 40px rgba(47, 107, 255, 0.35);
}

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100% - 32px);
  padding: 12px 16px; border-radius: 12px; font-size: 13.5px; cursor: pointer; z-index: 20;
  background: rgba(60, 12, 24, 0.95); border: 1px solid rgba(225, 29, 72, 0.6); color: #ffd0d8;
}

/* ---------- mobile ---------- */
@media (max-width: 860px) {
  .chat-page { padding: 0; }
  .shell { grid-template-columns: minmax(0, 1fr); border-radius: 0; border: 0; height: 100dvh; }
  .shell .conv { display: none; }
  .shell.has-active .sidebar { display: none; }
  .shell.has-active .conv { display: flex; }
  .back-btn { display: grid; }
  .sidebar { border-right: 0; padding-top: max(18px, env(safe-area-inset-top)); }
  .composer { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  .conv-head { padding-top: max(14px, env(safe-area-inset-top)); }
}

@media (max-width: 700px) {
  .login-card { grid-template-columns: 1fr; min-height: 0; }
  .login-left { clip-path: none; padding: 30px 28px 24px; }
  .login-right { padding: 26px 28px 32px; }
  .login-left h1 { font-size: 26px; }
}

.emoji-panel button { color: inherit; }
.toast { display: none; z-index: 40; }
[data-theme="light"] { --bg:#eef0f6; --text:#14141a; --muted:#6b6b78; --glass:rgba(0,0,0,.05); --glass-strong:rgba(0,0,0,.09); --border:rgba(0,0,0,.12); }
[data-theme="light"] .login-page { --text:#f4f4f6; --muted:#9a9aa6; }
[data-theme="light"] .chat-page { background:#e6e9f2; }
[data-theme="light"] .shell { background:rgba(255,255,255,.88); }
[data-theme="light"] .conv { background:rgba(255,255,255,.5); }
[data-theme="light"] .emoji-panel, [data-theme="light"] .modal { background:#fff; }
[data-theme="light"] .avatar { background:linear-gradient(135deg,#d5d8e4,#b9bdcf); }
[data-theme="light"] .online-dot { border-color:#fff; }
[data-theme="light"] .bubble time { color:rgba(0,0,0,.45); }
[data-theme="light"] .bubble.mine time { color:rgba(255,255,255,.75); }
.bubble.mine { color:#fff; }
.msg-col { display:flex; flex-direction:column; align-items:flex-start; max-width:min(520px,78%); }
.msg-row.mine .msg-col { align-items:flex-end; }
.msg-col .bubble { max-width:100%; }
.bubble.img-only { padding:4px; }
.bubble img.pic { display:block; max-width:100%; max-height:300px; border-radius:14px; cursor:pointer; }
.bubble.del p { font-style:italic; opacity:.7; }
.quote { margin:0 0 6px; padding:5px 9px; border-left:3px solid var(--red-2); border-radius:8px; background:rgba(0,0,0,.18); font-size:12px; opacity:.9; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.ticks { margin-left:4px; font-size:11px; letter-spacing:-2px; }
.ticks.seen { color:#7dd3fc; }
.reacts { display:flex; flex-wrap:wrap; gap:4px; margin:2px 6px 0; }
.react-chip { font-size:12px; padding:1px 6px; border-radius:12px; background:var(--glass-strong); border:1px solid var(--border); }
.react-chip.me { border-color:var(--blue); }
.actions { display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin:4px 0; padding:5px 8px; border-radius:14px; background:var(--glass-strong); border:1px solid var(--border); }
.actions button { font-size:13px; padding:3px 8px; border-radius:8px; color:var(--text); }
.actions button:hover { background:var(--glass); }
.actions .em { font-size:18px; padding:1px 4px; }
.ctx { display:flex; align-items:center; gap:8px; margin:0 18px 6px; padding:6px 10px; border-radius:10px; background:var(--glass); border-left:3px solid var(--blue); font-size:12.5px; color:var(--muted); }
.ctx span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.me-info { text-align:left; }
.pill.primary { background:var(--blue); color:#fff; }
.pill.on { background:rgba(225,29,72,.2); }
.stories { display:flex; gap:12px; overflow-x:auto; padding:12px 4px 2px; scrollbar-width:none; }
.stories::-webkit-scrollbar { display:none; }
.story-item { flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; width:58px; font-size:11px; color:var(--muted); }
.story-item span { max-width:58px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ring { padding:2px; border-radius:50%; background:linear-gradient(135deg,var(--red-2),var(--blue)); }
.ring.add { background:var(--glass-strong); }
.navrow { display:flex; gap:6px; margin-top:10px; }
.navrow .pill { flex:1; white-space:nowrap; padding:7px 4px; font-size:12px; display:flex; align-items:center; justify-content:center; gap:4px; }
.page { position:fixed; inset:0; z-index:25; background:var(--bg); }
.page-in { width:min(720px,100%); height:100%; margin:0 auto; display:flex; flex-direction:column; }
.page-head { display:flex; align-items:center; gap:10px; padding:12px; padding-top:max(12px,env(safe-area-inset-top)); border-bottom:1px solid var(--border); }
.page-body { flex:1; min-height:0; overflow-y:auto; padding:0 12px 24px; }
.fcomp { padding:12px 0; }
.fcomp textarea, .fcomp input { width:100%; padding:10px 12px; border-radius:12px; background:var(--glass); border:1px solid var(--border); outline:0; font-size:14px; resize:none; }
.fbtn { display:flex; align-items:center; gap:8px; margin-top:8px; }
.fbtn span { flex:1; }
.post { padding:12px; margin:10px 0; border-radius:16px; background:var(--glass); border:1px solid var(--border); }
.ptext { margin:8px 0; white-space:pre-wrap; word-break:break-word; font-size:14.5px; }
.pimg { width:100%; max-height:420px; object-fit:cover; border-radius:12px; cursor:pointer; display:block; margin:6px 0; }
.pact { display:flex; gap:8px; margin-top:6px; }
.prow { display:flex; align-items:center; gap:10px; padding:8px 4px; cursor:pointer; }
.prow .pn { flex:1; min-width:0; }
.sec { margin:14px 0 4px; font-size:12px; color:var(--muted); font-weight:600; }
.cover { height:120px; border-radius:0 0 18px 18px; background:linear-gradient(135deg,var(--blue),#7c3aed,var(--red)); }
.pcard { display:flex; flex-direction:column; align-items:center; margin-top:-46px; padding:0 16px 14px; text-align:center; gap:6px; }
.pcard .avatar { border:4px solid var(--bg); }
.pbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
.clist { max-height:260px; overflow-y:auto; }
.cmt { padding:6px 0; font-size:13.5px; word-break:break-word; }
.sv { width:min(420px,100%); height:min(720px,100%); border-radius:16px; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; color:#fff; cursor:pointer; }
.sv img { max-width:100%; max-height:100%; object-fit:contain; }
.sv p { position:absolute; bottom:8%; left:0; right:0; margin:0; text-align:center; padding:0 20px; font-size:20px; font-weight:600; text-shadow:0 2px 8px #000; }
.sv p.solo { top:0; bottom:0; display:flex; align-items:center; justify-content:center; }
.svh { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:8px; padding:12px; z-index:2; background:linear-gradient(#0009,transparent); }
.svh span { flex:1; font-size:12px; opacity:.8; }
.shared { margin:8px 0; padding:10px; border-radius:12px; border:1px solid var(--border); background:rgba(0,0,0,.12); }
.call { position:fixed; inset:0; z-index:35; background:#0b0b12; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
.cremote { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }
.call:not(.vid) .cremote { width:1px; height:1px; opacity:0; }

  const fd = new FormData();
  fd.append('file', blobOrFile, filename || 'upload');
  fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

  if (!res.ok) {
    let msg = 'Upload failed (HTTP ' + res.status + ')';
    try { const j = await res.json(); if (j && j.error && j.error.message) msg = j.error.message; } catch (e) {}
    throw new Error(msg);

  const data = await res.json();
  return { url: data.secure_url, resourceType: data.resource_type, format: data.format, bytes: data.bytes };

function viewChats() {
  const byId = usersById();
  return state.rawChats
    .filter((c) => c.lastMessage || c.id === state.activeId)
    .map((c) => ({ ...c, partner: partnerOf(c, byId), unreadCount: (c.unread && c.unread[me.uid]) || 0 }))
    .sort((a, b) => toMs(b.updatedAt) - toMs(a.updatedAt));
}

function currentPartner() {
  if (!state.activeId) return null;
  const c = viewChats().find((x) => x.id === state.activeId);
  if (c) return c.partner;
  const u = usersById()[state.activePartnerUid];
  if (u) return { uid: u.uid, name: u.name || 'User', email: u.email || '', photoURL: u.photoURL || '', lastSeen: u.lastSeen || null };

}

const QUICK = ['❤️', '😂', '👍', '😮', '😢', '🙏'];
function renderMessages() {

    const mine = m.senderId === me.uid;

    const seen = seenMs > 0 && t > 0 && seenMs >= t;
    const tick = mine && !del ? `<span class="ticks${seen ? ' seen' : ''}">${!t ? '🕓' : seen ? '✓✓' : '✓'}</span>` : '';
    const edited = m.edited && !del ? ' · edited' : '';
    const imgOnly = !del && m.imageUrl && !m.text && !m.replyTo;
    html += `<div class="${mine ? 'msg-row mine' : 'msg-row'}"><div class="msg-col"><div class="${(mine ? 'bubble mine' : 'bubble') + (del ? ' del' : '') + (imgOnly ? ' img-only' : '')}" data-msg="${esc(m.id)}">${inner}<time>${esc(formatTime(m.createdAt))}${edited}${tick}</time></div>`;
    const rc = {};
    Object.entries(m.reactions || {}).forEach(([u, e]) => { rc[e] = rc[e] || { n: 0, me: false }; rc[e].n++; if (u === me.uid) rc[e].me = true; });
    if (!del && Object.keys(rc).length) html += `<div class="reacts">${Object.entries(rc).map(([e, v]) => `<span class="react-chip${v.me ? ' me' : ''}">${esc(e)}${v.n > 1 ? ' ' + v.n : ''}</span>`).join('')}</div>`;
    if (state.selId === m.id && !del) html += actionsHtml(m, mine);
    html += '</div></div>';
  });
  box.innerHTML = html;
  if (stick) box.scrollTop = box.scrollHeight;
}

async function deleteMsg(m) {

let rec = null, recTimer = null;
function squarePhotoCanvas(file) {
  return new Promise((resolve, reject) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(u);
      const side = Math.min(im.naturalWidth, im.naturalHeight), cv = document.createElement('canvas');
      cv.width = cv.height = 300;
      cv.getContext('2d').drawImage(im, (im.naturalWidth - side) / 2, (im.naturalHeight - side) / 2, side, side, 0, 0, 300, 300);
      resolve(cv);
    };
    im.onerror = () => { URL.revokeObjectURL(u); reject(new Error('bad image')); };
    im.src = u;
  });
}
// Fast local preview only (no upload) — used while the modal is open.
async function squarePhotoPreview(file) {
  const cv = await squarePhotoCanvas(file);
  return cv.toDataURL('image/jpeg', 0.7);
}
// Final version used on Save: uploads to Cloudinary if configured, else falls back to base64.
async function squarePhoto(file) {
  const cv = await squarePhotoCanvas(file);
  if (MEDIA_READY) {
    const blob = await canvasToBlob(cv, 0.85);
    const r = await uploadToCloudinary(blob, 'avatar.jpg');
    return r.url;
  }
  return cv.toDataURL('image/jpeg', 0.7);
}

async function toggleRec() {
  if (rec) { rec.stop(); return; }
  if (state.sending || !state.activeId) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast('Ei browser e voice record kora jay na.'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { toast('Mic permission din.'); return; }
  const chatId = state.activeId, partner = currentPartner(), t0 = Date.now(), chunks = [];
  const mr = new MediaRecorder(stream, { audioBitsPerSecond: 24000 });
  rec = mr;
  mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    clearTimeout(recTimer);
    stream.getTracks().forEach((t) => t.stop());
    rec = null;
    const b = $('#micBtn'); if (b) { b.textContent = '🎤'; b.style.color = ''; }
    if (Date.now() - t0 < 700 || state.activeId !== chatId || !partner || state.sending) return;
    state.sending = true;
    try {
      const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
      let url;
      if (MEDIA_READY) { url = (await uploadToCloudinary(blob, 'voice.webm')).url; }
      else {
        url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
        if (url.length > 850000) { toast('Voice onek boro. Choto kore pathan (ba Cloudinary setup korun).'); return; }
      }
      const batch = writeBatch(db);
      batch.set(doc(collection(db, 'chats', chatId, 'messages')), { text: '', audioUrl: url, senderId: me.uid, createdAt: serverTimestamp() });
      batch.update(doc(db, 'chats', chatId), { lastMessage: { text: '🎤 Voice message', senderId: me.uid }, updatedAt: serverTimestamp(), ...unreadInc(partner, chatId) });
      await batch.commit();
    } catch (e) { console.error(e); toast('Voice pathano jayni. Abar try korun.'); }
    finally { state.sending = false; }
  };
  mr.start();
  recTimer = setTimeout(() => { if (mr.state === 'recording') mr.stop(); }, 60000);
  const b = $('#micBtn'); if (b) { b.textContent = '⏹'; b.style.color = '#ff4d6d'; }
}

/* ===== calls, share, group info ===== */
let call = null, incoming = null;
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
const setStat = (t) => { const e = call && call.el.querySelector('#cStat'); if (e) e.textContent = t; };
function callUI(name, photo, text) {
  const el = document.createElement('div');
  el.className = 'call';
  el.innerHTML = `<video class="cremote" id="cRemote" autoplay playsinline></video><video class="clocal" id="cLocal" autoplay playsinline muted></video><div class="cinfo">${avatar(name, photo, 84)}<h2 style="margin:6px 0 0">${esc(name)}</h2><div id="cStat">${esc(text)}</div></div><div class="cbtns" id="cBtns"></div>`;
  document.body.appendChild(el);
  return el;
}
function addCand(c) {
  if (!call) return;
  if (call.pc.remoteDescription) call.pc.addIceCandidate(c).catch(() => {}); else call.pending.push(c);
}
function flushCands() { if (call) call.pending.splice(0).forEach((c) => call.pc.addIceCandidate(c).catch(() => {})); }
function newCall(id, stream, type, u, caller) {
  const pc = new RTCPeerConnection(ICE);
  const el = callUI(u.name || 'User', u.photoURL, caller ? 'Calling...' : 'Connecting...');
  el.classList.toggle('vid', type === 'video');
  const c = { id, pc, stream, type, el, unsubs: [], pending: [], timer: null };
  stream.getTracks().forEach((t) => pc.addTrack(t, stream));
  el.querySelector('#cLocal').srcObject = stream;
  pc.ontrack = (e) => { el.querySelector('#cRemote').srcObject = e.streams[0]; el.classList.add('live'); setStat('Connected'); };
  pc.onicecandidate = (e) => { if (e.candidate) addDoc(collection(db, 'calls', id, 'ice'), { uid: me.uid, c: JSON.stringify(e.candidate) }).catch(() => {}); };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed') { toast('Call connect hoyni (network).'); endCall(true); }
    else if (pc.connectionState === 'disconnected') setStat('Reconnecting...');
    else if (pc.connectionState === 'connected') setStat('Connected');
  };
  c.unsubs.push(onSnapshot(collection(db, 'calls', id, 'ice'), (sn) => {
    sn.docChanges().forEach((ch) => { if (ch.type === 'added') { const d = ch.doc.data(); if (d.uid !== me.uid) addCand(JSON.parse(d.c)); } });
  }, () => {}));
  el.querySelector('#cBtns').innerHTML = `<button type="button" data-c="mute">🎙</button>${type === 'video' ? '<button type="button" data-c="cam">📹</button>' : ''}<button type="button" data-c="end" class="end">📵</button>`;
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-c]');
    if (!b) return;
    const k = b.dataset.c;
    if (k === 'end') endCall(true);
    else if (k === 'mute') { const t = stream.getAudioTracks()[0]; if (t) { t.enabled = !t.enabled; b.textContent = t.enabled ? '🎙' : '🔇'; } }
    else if (k === 'cam') { const t = stream.getVideoTracks()[0]; if (t) { t.enabled = !t.enabled; b.textContent = t.enabled ? '📹' : '🚫'; } }
  });
  return c;
}
function endCall(notify) {
  const c = call;
  if (!c) return;
  call = null;
  clearTimeout(c.timer);
  c.unsubs.forEach((f) => f());
  try { c.stream.getTracks().forEach((t) => t.stop()); c.pc.close(); } catch (e) {}
  c.el.remove();
  if (notify) updateDoc(doc(db, 'calls', c.id), { status: 'ended' }).catch(() => {});
}
async function startCall(uid, type) {
  if (call || incoming) { toast('Ekta call chalu ache.'); return; }
  const u = usersById()[uid];
  if (!u) return;
  if (!navigator.mediaDevices || !window.RTCPeerConnection) { toast('Ei browser e call hobe na.'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'video' }); } catch (e) { toast('Mic/Camera permission din.'); return; }
  const ref = doc(collection(db, 'calls'));
  call = newCall(ref.id, stream, type, u, true);
  try {
    const offer = await call.pc.createOffer();
    await call.pc.setLocalDescription(offer);
    await setDoc(ref, { from: me.uid, to: uid, type, status: 'ringing', offer: { type: offer.type, sdp: offer.sdp }, createdAt: serverTimestamp() });
  } catch (e) { console.error(e); endCall(false); toast('Call shuru hoyni. Firestore rules check korun.'); return; }
  call.unsubs.push(onSnapshot(ref, async (sn) => {
    const d = sn.data();
    if (!d || !call) return;
    try {
      if (d.answer && !call.pc.remoteDescription) { await call.pc.setRemoteDescription(d.answer); flushCands(); setStat('Connecting...'); }
    } catch (e) { console.error(e); }
    if (d.status === 'declined') { toast('Call decline kora hoyeche.'); endCall(false); }
    else if (d.status === 'ended') endCall(false);
  }));
  call.timer = setTimeout(() => { if (call && !call.pc.remoteDescription) { toast('Kew call dhoreni.'); endCall(true); } }, 45000);
}
function closeIncoming() { if (!incoming) return; clearInterval(incoming.ring); incoming.el.remove(); incoming = null; }
function showIncoming(d) {
  const u = usersById()[d.from] || {};
  const el = callUI(u.name || 'User', u.photoURL, d.type === 'video' ? '🎥 Incoming video call' : '📞 Incoming voice call');
  el.querySelector('#cBtns').innerHTML = '<button type="button" data-c="no" class="end">✕</button><button type="button" data-c="yes" class="ok">✓</button>';
  incoming = { id: d.id, el, ring: setInterval(beep, 1800) };
  beep();
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-c]');
    if (!b) return;
    if (b.dataset.c === 'yes') acceptCall(d);
    else { updateDoc(doc(db, 'calls', d.id), { status: 'declined' }).catch(() => {}); closeIncoming(); }
  });
}
function onIncomingCalls() {
  return onSnapshot(query(collection(db, 'calls'), where('to', '==', me.uid), where('status', '==', 'ringing')), (sn) => {
    const fresh = sn.docs.map((d) => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) })).filter((d) => Date.now() - toMs(d.createdAt) < 90000);
    if (incoming && !fresh.find((d) => d.id === incoming.id)) closeIncoming();
    if (!incoming && !call && fresh.length) showIncoming(fresh[0]);
  }, (err) => console.error(err));
}
async function acceptCall(d) {
  closeIncoming();
  if (call) return;
  const u = usersById()[d.from] || {};
  const ref = doc(db, 'calls', d.id);
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: d.type === 'video' }); } catch (e) { toast('Mic/Camera permission din.'); updateDoc(ref, { status: 'declined' }).catch(() => {}); return; }
  call = newCall(d.id, stream, d.type, u, false);
  try {
    await call.pc.setRemoteDescription(d.offer);
    flushCands();
    const ans = await call.pc.createAnswer();
    await call.pc.setLocalDescription(ans);
    await updateDoc(ref, { answer: { type: ans.type, sdp: ans.sdp }, status: 'accepted' });
  } catch (e) { console.error(e); endCall(true); toast('Call connect hoyni.'); return; }
  if (call) call.unsubs.push(onSnapshot(ref, (sn) => { const x = sn.data(); if (!x || x.status === 'ended') endCall(false); }));
}
