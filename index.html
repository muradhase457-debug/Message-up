<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#075E54" />
<title>Message Up V4 — WhatsApp Edition</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e11d48'/%3E%3Cpath d='M16 22a6 6 0 0 1 6-6h20a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6H31l-9 8v-8a6 6 0 0 1-6-6z' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #07070a;
  --text: #f4f4f6;
  --muted: #9a9aa6;
  --red: #e11d48;
  --red-2: #ff4d6d;
  --blue: #2f6bff;
  --blue-2: #1f55e0;
  --glass: rgba(255, 255, 255, 0.05);
  --glass-strong: rgba(255, 255, 255, 0.09);
  --border: rgba(255, 255, 255, 0.1);
  --green: #22c55e;
  font-family: 'Poppins', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:disabled { cursor: not-allowed; }

/* ---------- common ---------- */
.splash { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
.spinner {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.15); border-top-color: var(--red-2);
  animation: spin 0.8s linear infinite;
}
.spinner.small { width: 18px; height: 18px; border-width: 2px; border-top-color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }

.setup-card {
  max-width: 520px; padding: 28px; border-radius: 18px;
  background: var(--glass); border: 1px solid var(--border); line-height: 1.6;
}
.setup-card h1 { margin-top: 0; font-size: 22px; }
.setup-card code { background: rgba(255,255,255,.1); padding: 2px 6px; border-radius: 6px; }

.avatar {
  position: relative; flex: none; border-radius: 50%;
  background: linear-gradient(135deg, #3b3b4a, #23232d);
  display: grid; place-items: center; font-weight: 600;
}
.avatar span { position: relative; }
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.online-dot {
  position: absolute; right: 0; bottom: 0; width: 25%; height: 25%; min-width: 9px; min-height: 9px;
  background: var(--green); border: 2px solid #15151b; border-radius: 50%;
}

.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  color: var(--muted); flex: none; transition: background 0.15s, color 0.15s;
}
.icon-btn:hover { background: var(--glass-strong); color: var(--text); }

/* ---------- login ---------- */
.login-page {
  min-height: 100dvh; display: grid; place-items: center; padding: 20px; position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse 80% 55% at 50% 115%, rgba(225, 29, 72, 0.5), transparent 65%),
    radial-gradient(ellipse 60% 40% at 50% -10%, rgba(225, 29, 72, 0.16), transparent 60%),
    #070709;
}
.login-page::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(225, 29, 72, 0.14) 1px, transparent 1px),
    linear-gradient(90deg, rgba(225, 29, 72, 0.14) 1px, transparent 1px);
  background-size: 70px 70px;
  -webkit-mask-image: radial-gradient(ellipse at center, #000 10%, transparent 75%);
  mask-image: radial-gradient(ellipse at center, #000 10%, transparent 75%);
}
.glow-dot {
  position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--red-2);
  box-shadow: 0 0 14px 4px rgba(255, 77, 109, 0.8); animation: pulse 2.6s ease-in-out infinite;
}
.glow-dot.d1 { top: 22%; left: 12%; }
.glow-dot.d2 { bottom: 24%; right: 10%; animation-delay: 0.9s; }
.glow-dot.d3 { top: 14%; right: 24%; animation-delay: 1.6s; }
@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

.login-card {
  position: relative; z-index: 1; width: min(880px, 100%); min-height: 420px;
  display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border-radius: 22px;
  background: rgba(45, 8, 16, 0.55); border: 1px solid rgba(255, 255, 255, 0.12);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.login-left {
  display: flex; flex-direction: column; justify-content: center; padding: 40px 56px 40px 40px;
  background: linear-gradient(135deg, rgba(225, 29, 72, 0.32), rgba(120, 10, 30, 0.1));
  clip-path: polygon(0 0, 100% 0, 84% 100%, 0 100%);
}
.brand-mark {
  width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 18px;
  background: linear-gradient(135deg, var(--red-2), #c9184a); box-shadow: 0 8px 24px rgba(225, 29, 72, 0.45);
}
.login-left h1 { margin: 0 0 10px; font-size: 30px; letter-spacing: 0.5px; }
.login-left p { margin: 0; color: #e7c9cf; font-size: 14px; line-height: 1.6; }

.login-right { display: flex; flex-direction: column; justify-content: center; padding: 40px; }
.login-right h2 { margin: 0 0 4px; font-size: 28px; }
.login-sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
.google-btn {
  display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; height: 50px;
  border-radius: 12px; background: #fff; color: #1f1f1f; font-weight: 600; font-size: 15px;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35); transition: transform 0.15s, box-shadow 0.15s;
}
.google-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(225, 29, 72, 0.35); }
.google-btn:disabled { opacity: 0.75; }
.google-btn .spinner.small { border-color: rgba(0,0,0,.15); border-top-color: #333; }
.form-error {
  margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5;
  background: rgba(225, 29, 72, 0.15); border: 1px solid rgba(225, 29, 72, 0.5); color: #ffc2cd;
}
.login-points { list-style: none; margin: 26px 0 0; padding: 0; display: grid; gap: 8px; color: var(--muted); font-size: 13px; }
.login-points li { display: flex; align-items: center; gap: 8px; }
.login-points svg { color: var(--red-2); }

/* ---------- chat ---------- */
.chat-page {
  height: 100dvh; display: grid; place-items: center; padding: 16px;
  background:
    radial-gradient(ellipse 60% 50% at 20% 0%, rgba(47, 107, 255, 0.18), transparent 60%),
    radial-gradient(ellipse 50% 40% at 100% 100%, rgba(120, 60, 255, 0.14), transparent 60%),
    #0a0a0f;
}
.shell {
  width: min(1180px, 100%); height: min(780px, 100%);
  display: grid; grid-template-columns: 380px minmax(0, 1fr); overflow: hidden; border-radius: 26px;
  background: rgba(24, 24, 32, 0.78); border: 1px solid var(--border);
  -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
}

.sidebar { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--border); padding: 18px 14px 8px; }
.me-row { display: flex; align-items: center; gap: 10px; padding: 0 4px 14px; }
.me-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.me-info strong, .me-info span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-info strong { font-size: 15px; }
.me-info span { font-size: 12px; color: var(--muted); }

.search-box {
  display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border-radius: 12px;
  background: var(--glass); border: 1px solid var(--border); color: var(--muted);
}
.search-box input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: 14px; }
.search-box input::placeholder { color: var(--muted); }
.search-box:focus-within { border-color: rgba(47, 107, 255, 0.7); }

.recent-row { display: flex; gap: 14px; overflow-x: auto; padding: 14px 4px 4px; scrollbar-width: none; }
.recent-row::-webkit-scrollbar { display: none; }
.recent-item { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); width: 52px; }
.recent-item span { max-width: 52px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tabs { display: flex; gap: 6px; margin: 14px 0 6px; padding: 4px; border-radius: 12px; background: var(--glass); }
.tab {
  flex: 1; height: 34px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--muted);
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s, color 0.15s;
}
.tab.active { background: var(--glass-strong); color: var(--text); }

.badge {
  font-style: normal; font-size: 11px; font-weight: 600; min-width: 20px; height: 20px; padding: 0 6px;
  border-radius: 10px; display: inline-grid; place-items: center; background: var(--blue); color: #fff;
}

.list { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
.list-empty { padding: 28px 14px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border-radius: 14px; text-align: left;
  transition: background 0.15s;
}
.row:hover { background: var(--glass); }
.row.active { background: var(--glass-strong); }
.row-main { flex: 1; min-width: 0; }
.row-top, .row-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.row-top strong { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-top time { font-size: 11px; color: var(--muted); flex: none; }
.preview { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preview.unread { color: var(--text); font-weight: 500; }
.row-bottom { margin-top: 2px; }

/* conversation */
.conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: rgba(10, 10, 15, 0.35); }
.conv-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.conv-title { display: flex; flex-direction: column; min-width: 0; }
.conv-title strong { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { font-size: 12px; color: var(--muted); }
.status.on { color: var(--green); }
.back-btn { display: none; }

.messages { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; }
.empty-hint { margin: auto; color: var(--muted); font-size: 14px; }
.day-sep { text-align: center; margin: 14px 0 8px; }
.day-sep span { font-size: 11px; color: var(--muted); padding: 4px 12px; border-radius: 20px; background: var(--glass); }
.msg-row { display: flex; margin: 2px 0; }
.msg-row.mine { justify-content: flex-end; }
.bubble {
  max-width: min(520px, 78%); padding: 9px 13px 6px; border-radius: 18px 18px 18px 6px;
  background: var(--glass-strong); word-break: break-word;
}
.bubble.mine { background: linear-gradient(135deg, var(--blue), var(--blue-2)); border-radius: 18px 18px 6px 18px; }
.bubble p { margin: 0; font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; }
.bubble time { display: block; text-align: right; margin-top: 2px; font-size: 10.5px; color: rgba(255, 255, 255, 0.6); }

.conv-error { margin: 0 18px 8px; padding: 8px 12px; border-radius: 10px; font-size: 13px; background: rgba(225, 29, 72, 0.15); color: #ffc2cd; }
.emoji-panel {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; margin: 0 18px 8px; padding: 8px; border-radius: 14px;
  background: rgba(30, 30, 40, 0.95); border: 1px solid var(--border);
}
.emoji-panel button { font-size: 22px; padding: 4px; border-radius: 8px; }
.emoji-panel button:hover { background: var(--glass-strong); }

.composer { display: flex; align-items: flex-end; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid var(--border); }
.composer textarea {
  flex: 1; min-width: 0; resize: none; max-height: 120px; padding: 11px 16px; border-radius: 22px; font-size: 14.5px;
  background: var(--glass); border: 1px solid var(--border); outline: 0; line-height: 1.4;
}
.composer textarea:focus { border-color: rgba(47, 107, 255, 0.7); }
.send-btn {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: linear-gradient(135deg, var(--blue), var(--blue-2)); color: #fff; transition: opacity 0.15s, transform 0.15s;
}
.send-btn:hover:not(:disabled) { transform: scale(1.06); }
.send-btn:disabled { opacity: 0.4; }

.conv-empty { align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); }
.conv-empty h3 { margin: 14px 0 6px; color: var(--text); font-size: 20px; }
.conv-empty p { margin: 0; max-width: 300px; font-size: 14px; line-height: 1.6; }
.empty-art {
  width: 84px; height: 84px; border-radius: 24px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--blue), #7c3aed); box-shadow: 0 14px 40px rgba(47, 107, 255, 0.35);
}

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100% - 32px);
  padding: 12px 16px; border-radius: 12px; font-size: 13.5px; cursor: pointer; z-index: 20;
  background: rgba(60, 12, 24, 0.95); border: 1px solid rgba(225, 29, 72, 0.6); color: #ffd0d8;
}

/* ---------- V4 responsive: desktop = pic two-pane, phone = WhatsApp single-pane ---------- */
@media (min-width: 769px) {
  .shell { grid-template-columns: 380px minmax(0, 1fr); }
  .shell .sidebar { display: flex; }
  .shell .conv { display: flex; }
  .back-btn { display: none !important; }
}
@media (max-width: 768px) {
  .chat-page { padding: 0; }
  .shell { grid-template-columns: minmax(0, 1fr); border-radius: 0; border: 0; height: 100dvh; height: calc(var(--v4-vh, 1vh) * 100); }
  .shell .conv { display: none; }
  .shell.has-active .sidebar { display: none; }
  .shell.has-active .conv { display: flex; }
  .back-btn { display: grid; }
  .sidebar { border-right: 0; padding-top: max(18px, env(safe-area-inset-top)); }
  .composer { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  .composer textarea { font-size: 16px; }
  .conv-head { padding-top: max(14px, env(safe-area-inset-top)); }
  .login-card { grid-template-columns: 1fr; min-height: 0; }
}

/* ---------- V4: dot menus, themes, beauty ---------- */
.dot-backdrop { position: fixed; inset: 0; z-index: 44; background: rgba(0,0,0,.35); display: none; }
.dot-menu { position: fixed; z-index: 45; min-width: 240px; max-width: calc(100vw - 24px); max-height: 70dvh; overflow-y: auto; padding: 8px; border-radius: 16px; background: #233138; border: 1px solid var(--border); box-shadow: 0 18px 50px rgba(0,0,0,.5); transform: translateY(-8px) scale(.98); opacity: 0; pointer-events: none; transition: transform .18s ease, opacity .18s ease; display: none; }
.dot-menu.open { display: block; transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
.dot-menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; border-radius: 10px; font-size: 14px; text-align: left; color: var(--text); }
.dot-menu button:hover { background: var(--glass-strong); }
.dot-menu .dot-sep { height: 1px; background: var(--border); margin: 6px 8px; }
.dot-menu .dot-head { padding: 6px 12px 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
[data-theme="light"] .dot-menu { background: #fff; }
@keyframes v4MsgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.messages .msg-row:last-child { animation: v4MsgIn .2s ease-out; }
.avatar.v4-online { box-shadow: 0 0 0 2px #25D366; }
.login-page { background: radial-gradient(ellipse 80% 55% at 50% 115%, rgba(37,211,102,.35), transparent 65%), radial-gradient(ellipse 60% 40% at 50% -10%, rgba(7,94,84,.5), transparent 60%), #0B141A; }
.login-left { background: linear-gradient(135deg, #075E54, #128C7E); }
.login-left p { color: #D9FDD3; }
.brand-mark { background: linear-gradient(135deg, #25D366, #128C7E); box-shadow: 0 8px 24px rgba(37,211,102,.45); }
[data-v4theme="midnight"] { --bg: #05070F; --wa-side: #0A0E1A; --wa-head: #11182A; --wa-bubble-mine: #1B2A4A; --blue: #7C8CF8; --blue-2: #4F63D2; }
[data-v4theme="rose"] { --blue: #E75480; --blue-2: #C2185B; --wa-accent: #E75480; --wa-bubble-mine: #7A1F3D; --wa-teal: #8E2450; --wa-teal2: #B03060; }
[data-v4theme="ocean"] { --blue: #00A8C5; --blue-2: #0077B6; --wa-accent: #00A8C5; --wa-bubble-mine: #005F73; --wa-teal: #005F73; --wa-teal2: #0A9396; }

@media (max-width: 700px) {
  .login-card { grid-template-columns: 1fr; min-height: 0; }
  .login-left { clip-path: none; padding: 30px 28px 24px; }
  .login-right { padding: 26px 28px 32px; }
  .login-left h1 { font-size: 26px; }
}

.emoji-panel button { color: inherit; }
.toast { display: none; z-index: 40; }
[data-theme="light"] { --bg:#eef0f6; --text:#14141a; --muted:#6b6b78; --glass:rgba(0,0,0,.05); --glass-strong:rgba(0,0,0,.09); --border:rgba(0,0,0,.12); }
[data-theme="light"] .login-page { --text:#f4f4f6; --muted:#9a9aa6; }
[data-theme="light"] .chat-page { background:#e6e9f2; }
[data-theme="light"] .shell { background:rgba(255,255,255,.88); }
[data-theme="light"] .conv { background:rgba(255,255,255,.5); }
[data-theme="light"] .emoji-panel, [data-theme="light"] .modal { background:#fff; }
[data-theme="light"] .avatar { background:linear-gradient(135deg,#d5d8e4,#b9bdcf); }
[data-theme="light"] .online-dot { border-color:#fff; }
[data-theme="light"] .bubble time { color:rgba(0,0,0,.45); }
[data-theme="light"] .bubble.mine time { color:rgba(255,255,255,.75); }
.bubble.mine { color:#fff; }
.msg-col { display:flex; flex-direction:column; align-items:flex-start; max-width:min(520px,78%); }
.msg-row.mine .msg-col { align-items:flex-end; }
.msg-col .bubble { max-width:100%; }
.bubble.img-only { padding:4px; }
.bubble img.pic { display:block; max-width:100%; max-height:300px; border-radius:14px; cursor:pointer; }
.bubble.del p { font-style:italic; opacity:.7; }
.quote { margin:0 0 6px; padding:5px 9px; border-left:3px solid var(--red-2); border-radius:8px; background:rgba(0,0,0,.18); font-size:12px; opacity:.9; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.ticks { margin-left:4px; font-size:11px; letter-spacing:-2px; }
.ticks.seen { color:#7dd3fc; }
.reacts { display:flex; flex-wrap:wrap; gap:4px; margin:2px 6px 0; }
.react-chip { font-size:12px; padding:1px 6px; border-radius:12px; background:var(--glass-strong); border:1px solid var(--border); }
.react-chip.me { border-color:var(--blue); }
.actions { display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin:4px 0; padding:5px 8px; border-radius:14px; background:var(--glass-strong); border:1px solid var(--border); }
.actions button { font-size:13px; padding:3px 8px; border-radius:8px; color:var(--text); }
.actions button:hover { background:var(--glass); }
.actions .em { font-size:18px; padding:1px 4px; }
.ctx { display:flex; align-items:center; gap:8px; margin:0 18px 6px; padding:6px 10px; border-radius:10px; background:var(--glass); border-left:3px solid var(--blue); font-size:12.5px; color:var(--muted); }
.ctx span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.me-info { text-align:left; }
.pill.primary { background:linear-gradient(135deg, var(--blue), #7c3aed); color:#fff; box-shadow:0 6px 16px rgba(47,107,255,.35); }
.pill.on { background:rgba(225,29,72,.2); }
.stories { display:flex; gap:12px; overflow-x:auto; padding:12px 4px 2px; scrollbar-width:none; }
.stories::-webkit-scrollbar { display:none; }
.story-item { flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; width:58px; font-size:11px; color:var(--muted); }
.story-item span { max-width:58px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ring { padding:2px; border-radius:50%; background:linear-gradient(135deg,var(--red-2),var(--blue)); }
.ring.add { background:var(--glass-strong); }
.navrow { display:flex; gap:6px; margin-top:10px; }
.navrow .pill { flex:1; white-space:nowrap; padding:7px 4px; font-size:12px; display:flex; align-items:center; justify-content:center; gap:4px; }
.page { position:fixed; inset:0; z-index:25; background:var(--bg); }
.page-in { width:min(720px,100%); height:100%; margin:0 auto; display:flex; flex-direction:column; }
.page-head { display:flex; align-items:center; gap:10px; padding:12px; padding-top:max(12px,env(safe-area-inset-top)); border-bottom:1px solid var(--border); }
.page-body { flex:1; min-height:0; overflow-y:auto; padding:0 12px 24px; }
.fcomp { padding:12px 0; }
.fcomp textarea, .fcomp input { width:100%; padding:10px 12px; border-radius:12px; background:var(--glass); border:1px solid var(--border); outline:0; font-size:14px; resize:none; }
.fbtn { display:flex; align-items:center; gap:8px; margin-top:8px; }
.fbtn span { flex:1; }
.post { padding:12px; margin:10px 0; border-radius:16px; background:var(--glass); border:1px solid var(--border); }
.ptext { margin:8px 0; white-space:pre-wrap; word-break:break-word; font-size:14.5px; }
.pimg { width:100%; max-height:420px; object-fit:cover; border-radius:12px; cursor:pointer; display:block; margin:6px 0; }
.pact { display:flex; gap:8px; margin-top:6px; }
/* Facebook-style feed post card */
.post.fbpost { padding:12px 0 0; overflow:hidden; }
.fbpost .post-head { display:flex; align-items:flex-start; gap:10px; padding:0 12px 8px; }
.fbpost .post-head .prow { padding:0; cursor:pointer; }
.fbpost .post-menu { flex:none; margin-left:auto; color:var(--muted); }
.fbpost .pn .preview { display:flex; align-items:center; gap:5px; }
.fbpost .ptext-wrap { padding:0 12px; }
.fbpost .ptext { margin:0 0 4px; }
.fbpost .ptext.clamp { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.fbpost .seemore { background:none; padding:0; margin:0 0 8px; color:var(--blue); font-weight:700; font-size:13.5px; display:block; }
.fbpost .pimg { border-radius:0; margin:8px 0 0; max-height:460px; }
.fbpost .shared { margin:8px 12px 0; }
.fbpost .post-meta { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; font-size:12.5px; color:var(--muted); }
.fbpost .post-meta .mlike { display:flex; align-items:center; gap:4px; }
.fbpost .post-meta .mlike svg { color:#fff; background:var(--blue); border-radius:50%; padding:3px; width:16px; height:16px; }
.fbpost .post-meta .mcmt { cursor:pointer; }
.fbpost .post-bar { display:flex; margin:2px 12px 10px; border-radius:14px; background:var(--glass-strong); overflow:hidden; }
.fbpost .post-bar .pbtn { flex:1; display:flex; align-items:center; justify-content:center; padding:9px 0; color:var(--muted); }
.fbpost .post-bar .pbtn.active { color:var(--blue); }
.fbpost .post-bar .pbtn:active { background:rgba(255,255,255,.08); }
.prow { display:flex; align-items:center; gap:10px; padding:8px 4px; cursor:pointer; }
.prow .pn { flex:1; min-width:0; }
.sec { margin:14px 0 4px; font-size:12px; color:var(--muted); font-weight:600; }
.cover { height:120px; border-radius:0 0 18px 18px; background:linear-gradient(135deg,var(--blue),#7c3aed,var(--red)); }
.pcard { display:flex; flex-direction:column; align-items:center; margin-top:-46px; padding:0 16px 14px; text-align:center; gap:6px; }
.pcard .avatar { border:4px solid var(--bg); }
.pbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
.clist { max-height:260px; overflow-y:auto; }
.cmt { padding:6px 0; font-size:13.5px; word-break:break-word; }
.sv { width:min(420px,100%); height:min(720px,100%); border-radius:16px; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; color:#fff; cursor:pointer; }
.sv img { max-width:100%; max-height:100%; object-fit:contain; }
.sv p { position:absolute; bottom:8%; left:0; right:0; margin:0; text-align:center; padding:0 20px; font-size:20px; font-weight:600; text-shadow:0 2px 8px #000; }
.sv p.solo { top:0; bottom:0; display:flex; align-items:center; justify-content:center; }
.svh { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:8px; padding:12px; z-index:2; background:linear-gradient(#0009,transparent); }
.svh span { flex:1; font-size:12px; opacity:.8; }
.shared { margin:8px 0; padding:10px; border-radius:12px; border:1px solid var(--border); background:rgba(0,0,0,.12); }
.call { position:fixed; inset:0; z-index:35; background:#0b0b12; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
.cremote { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }
.call:not(.vid) .cremote { width:1px; height:1px; opacity:0; }
.clocal { position:absolute; right:14px; top:max(14px,env(safe-area-inset-top)); width:96px; height:130px; object-fit:cover; border-radius:12px; background:#222; z-index:2; transform:scaleX(-1); }
.call:not(.vid) .clocal { display:none; }
.cinfo { position:relative; z-index:1; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; }
.call.vid.live .cinfo { display:none; }
.cbtns { position:absolute; bottom:max(36px,env(safe-area-inset-bottom)); display:flex; gap:18px; z-index:3; }
.cbtns button { width:60px; height:60px; border-radius:50%; font-size:24px; background:rgba(255,255,255,.18); color:#fff; }
.cbtns .end { background:#e11d48; }
.cbtns .ok { background:#22c55e; }
.pill { padding:6px 12px; border-radius:10px; background:var(--glass-strong); font-size:13px; color:var(--text); }
.set-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); font-size:14px; }
.set-row span { min-width:0; overflow:hidden; text-overflow:ellipsis; }
.bubble audio { width:220px; max-width:100%; height:38px; display:block; }
.modal-bg { position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:16px; background:rgba(0,0,0,.6); }
.modal { width:min(380px,100%); padding:22px; border-radius:18px; background:#181820; border:1px solid var(--border); }
.modal h3 { margin:0 0 14px; }
.modal label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
.modal input, .modal textarea { width:100%; padding:10px 12px; border-radius:10px; background:var(--glass); border:1px solid var(--border); outline:0; font-size:14px; resize:none; }
.modal .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.modal .btns button { padding:9px 16px; border-radius:10px; background:var(--glass-strong); font-size:14px; }
.modal .btns .primary { background:linear-gradient(135deg, var(--blue), #7c3aed); color:#fff; }

/* ===== v2 additions: status chips, mentions, admin, reels, 3D polish ===== */
.status-chips { display:flex; gap:6px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:none; }
.status-chips::-webkit-scrollbar { display:none; }
.chip { flex:none; padding:6px 11px; border-radius:20px; font-size:12.5px; background:var(--glass); border:1px solid var(--border); color:var(--text); white-space:nowrap; transition: all .15s; }
.chip.on, .chip:hover { background:linear-gradient(135deg,var(--blue),var(--blue-2)); color:#fff; border-color:transparent; }
.mention { color:#7dc4ff; font-weight:600; background:rgba(47,107,255,.14); padding:0 3px; border-radius:5px; }
[data-theme="light"] .mention { color:#1f55e0; }
.mention-box { position:fixed; z-index:50; max-height:220px; overflow-y:auto; background:#1c1c26; border:1px solid var(--border); border-radius:12px; box-shadow:0 14px 40px rgba(0,0,0,.5); padding:4px; }
.mention-box button { display:flex; align-items:center; gap:8px; width:100%; padding:6px 8px; border-radius:8px; font-size:13px; text-align:left; color:#fff; }
.mention-box button:hover { background:rgba(255,255,255,.08); }
.mention-box em { font-style:normal; color:var(--muted); font-size:11px; }
.announce-bar { align-items:center; gap:8px; margin:8px 2px 0; padding:8px 12px; border-radius:12px; font-size:12.5px; background:linear-gradient(135deg,rgba(225,29,72,.22),rgba(47,107,255,.18)); border:1px solid var(--border); color:var(--text); }

/* floating gradient blobs for extra depth on the chat page */
.chat-page::before, .chat-page::after {
  content:''; position:fixed; width:420px; height:420px; border-radius:50%; filter:blur(90px); z-index:0; pointer-events:none; opacity:.55;
  animation: float 16s ease-in-out infinite;
}
.chat-page::before { background:radial-gradient(circle, rgba(225,29,72,.35), transparent 70%); top:-120px; left:-120px; }
.chat-page::after { background:radial-gradient(circle, rgba(47,107,255,.3), transparent 70%); bottom:-140px; right:-140px; animation-delay:4s; }
@keyframes float { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(30px,-20px) scale(1.08); } }
.shell { position:relative; z-index:1; transform-style:preserve-3d; }

/* animated gradient story ring (Instagram-style) */
.ring { position:relative; padding:2px; border-radius:50%; background:conic-gradient(from 0deg, var(--red-2), #ffb020, var(--blue), #7c3aed, var(--red-2)); animation:ringspin 4s linear infinite; }
.ring.add { background:var(--glass-strong); animation:none; }
@keyframes ringspin { to { filter:hue-rotate(360deg); } }

/* subtle 3D tilt on cards (desktop hover only) */
.post, .row, .pcard { transition: transform .25s ease, box-shadow .25s ease; }
@media (hover:hover) and (pointer:fine) {
  .post:hover { transform: translateY(-2px) scale(1.003); box-shadow:0 14px 34px rgba(0,0,0,.35); }
  .row:hover { transform: translateX(2px); }
}
.tab, .pill, .send-btn, .google-btn, .chip { transition: transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease; }
.pill:active, .send-btn:active, .chip:active { transform: scale(.94); }
.modal, .page, .modal-bg { animation: popIn .22s ease; }
@keyframes popIn { from { opacity:0; transform: translateY(8px) scale(.98); } to { opacity:1; transform:none; } }
.modal { box-shadow:0 30px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06); }

/* admin */
#adminBtn { color: var(--red-2); }

/* ===== reels (Instagram-style vertical video) ===== */
.reels-wrap { position:fixed; inset:0; z-index:38; background:#000; overflow-y:auto; scroll-snap-type:y mandatory; scrollbar-width:none; }
.reels-wrap::-webkit-scrollbar { display:none; }
.reel { position:relative; height:100dvh; width:100%; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; background:#000; }
.reel video { width:100%; height:100%; object-fit:cover; }
.reel-info { position:absolute; left:14px; right:84px; bottom:max(28px,env(safe-area-inset-bottom)); color:#fff; pointer-events:none; }
.reel-info .prow { pointer-events:auto; cursor:pointer; padding:0; margin-bottom:6px; }
.reel-info p { margin:0; font-size:14px; line-height:1.4; text-shadow:0 2px 6px rgba(0,0,0,.6); }
.reel-acts { position:absolute; right:10px; bottom:max(40px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:16px; align-items:center; }
.reel-acts button { color:#fff; font-size:24px; background:rgba(255,255,255,.16); width:46px; height:46px; border-radius:50%; backdrop-filter:blur(6px); }
.reels-close { position:fixed; top:max(14px,env(safe-area-inset-top)); left:14px; z-index:2; background:rgba(0,0,0,.45); color:#fff; }

/* nav row: allow more items to scroll nicely */
.navrow { overflow-x:auto; scrollbar-width:none; }
.navrow::-webkit-scrollbar { display:none; }
.navrow .pill { flex:0 0 auto; min-width:64px; }

/* ===== Chat Pro: pin / search / select / forward ===== */
.pinned-bar { align-items:center; gap:8px; margin:0 18px; padding:8px 12px; border-radius:10px; background:rgba(47,107,255,.14); border-left:3px solid var(--blue); font-size:12.5px; cursor:pointer; }
.search-bar { display:flex; align-items:center; gap:6px; margin:0 18px 8px; padding:6px 10px; border-radius:10px; background:var(--glass); border:1px solid var(--border); }
.search-bar input { flex:1; min-width:0; background:none; border:0; outline:0; color:var(--text); font-size:13.5px; }
.search-bar span { font-size:11px; color:var(--muted); white-space:nowrap; }
.select-bar { display:flex; align-items:center; gap:8px; padding:10px 16px; border-top:1px solid var(--border); background:var(--glass); }
.select-bar span { flex:1; font-size:13px; color:var(--muted); }
.msg-row.selectable { align-items:center; gap:8px; cursor:pointer; }
.sel-check { flex:none; width:20px; height:20px; border-radius:50%; border:2px solid var(--border); display:grid; place-items:center; font-size:12px; color:#fff; }
.sel-check.on { background:var(--blue); border-color:var(--blue); }
mark { background:#ffd54a; color:#1a1a1a; padding:0 1px; border-radius:3px; }

/* verified badge */
.vbadge { color:#2f6bff; font-size:0.9em; display:inline-block; vertical-align:middle; }

/* follow stats */
.stat-row { display:flex; gap:20px; justify-content:center; margin:6px 0; }
.stat-row button { text-align:center; color:var(--text); }
.stat-row strong { display:block; font-size:16px; }
.stat-row span { font-size:11px; color:var(--muted); }

/* highlights row */
.highlights { display:flex; gap:12px; overflow-x:auto; padding:8px 4px; scrollbar-width:none; justify-content:center; }
.highlights::-webkit-scrollbar { display:none; }

/* group/live call grid */
.call-grid { position:absolute; inset:0; display:grid; gap:4px; padding:4px; }
.call-grid video { width:100%; height:100%; object-fit:cover; border-radius:10px; background:#111; }
.call-tile { position:relative; border-radius:10px; overflow:hidden; background:#111; }
.call-tile .tname { position:absolute; left:6px; bottom:6px; font-size:11px; background:rgba(0,0,0,.5); padding:2px 7px; border-radius:8px; color:#fff; }
.live-badge { position:absolute; top:-2px; right:-2px; background:#e11d48; color:#fff; font-size:9px; font-weight:700; padding:1px 5px; border-radius:8px; border:2px solid var(--bg); animation:livepulse 1.6s ease-in-out infinite; }
@keyframes livepulse { 0%,100% { box-shadow:0 0 0 0 rgba(225,29,72,.6); } 50% { box-shadow:0 0 0 5px rgba(225,29,72,0); } }
.vbadge { animation: popIn .25s ease; }
.stat-row button { border-radius:12px; padding:4px 10px; transition:background .15s ease; }
.stat-row button:hover, .stat-row button:active { background:var(--glass-strong); }
.highlights .prow:active { transform:scale(.95); }
.call-tile { box-shadow:0 10px 26px rgba(0,0,0,.4); }


/* ===== Message Up V2 additions ===== */
.v2-inbox { margin:0 0 8px; padding:9px 11px; border-radius:12px; background:var(--glass-strong); border:1px solid var(--border); font-size:12.5px; line-height:1.5; }
.v2-queue-banner { margin:0 0 10px; padding:8px 11px; border-radius:10px; background:rgba(255,193,7,.14); border:1px solid rgba(255,193,7,.4); font-size:12.5px; }
.v2-translation { margin-top:5px; padding:6px 9px; border-radius:9px; background:var(--glass); border:1px solid var(--border); font-size:12.5px; line-height:1.5; }
.v2-vault { text-align:center; padding:44px 18px; }
.v2-vault h3 { margin:10px 0 6px; }
.v2-vault p { color:var(--muted); font-size:13px; }
.speed-placeholder { display:block; width:100%; padding:26px 10px; border-radius:12px; background:var(--glass-strong); border:1px dashed var(--border); color:var(--text); font-size:13px; }
.ticks.sent { color:var(--muted); }
.ticks.seen { color:#7dd3fc; }
#dictBtn.active { color:#ff4d6d; background:var(--glass-strong); }


/* ===== Message Up V4 — WhatsApp Edition theme ===== */
:root { --bg:#0B141A; --text:#E9EDEF; --muted:#8696A0; --red:#e11d48; --red-2:#ff4d6d; --blue:#25D366; --blue-2:#008069; --green:#25D366; --glass:rgba(255,255,255,.06); --glass-strong:rgba(255,255,255,.09); --border:rgba(255,255,255,.10); --wa-head:#202C33; --wa-side:#111B21; --wa-teal:#075E54; --wa-teal2:#008069; --wa-accent:#25D366; --wa-bubble-mine:#005C4B; --wa-bubble-other:#202C33; }
.chat-page { background:#0B141A; }
.chat-page::before, .chat-page::after { display:none; }
.shell { background:var(--wa-side); border:1px solid rgba(255,255,255,.08); border-radius:12px; }
.sidebar { background:#111B21; border-right:1px solid rgba(255,255,255,.08); }
.me-row { padding-bottom:12px; }
.search-box { background:#202C33; border:0; border-radius:8px; }
.search-box:focus-within { border-color:transparent; box-shadow:0 0 0 1px rgba(37,211,102,.5); }
.tabs { background:#111B21; padding:0; gap:0; border-radius:0; }
.tab { border-radius:0; color:#8696A0; font-size:14px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
.tab.active { background:transparent; color:#25D366; box-shadow:inset 0 -3px 0 #25D366; }
.navrow .pill { background:#202C33; border-radius:20px; }
.conv { background:#0B141A; }
.conv-head { background:#202C33; border-bottom:0; }
.messages { background-color:#0B141A; background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px), radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px); background-size:34px 34px, 52px 52px; background-position:0 0, 17px 26px; }
.messages.wall-1 { background-color:#0B141A; }
.messages.wall-2 { background-color:#12261F; background-image:linear-gradient(135deg, rgba(37,211,102,.08) 25%, transparent 25%, transparent 75%, rgba(37,211,102,.08) 75%); background-size:28px 28px; }
.messages.wall-3 { background-color:#1B2430; background-image:radial-gradient(rgba(37,211,102,.14) 2px, transparent 2px); background-size:26px 26px; }
.messages.wall-4 { background-color:#241B2E; background-image:linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size:22px 22px; }
.bubble { background:#202C33; color:#E9EDEF; border-radius:8px 8px 8px 0; box-shadow:0 1px 1px rgba(0,0,0,.3); }
.bubble.mine { background:#005C4B; color:#E9EDEF; border-radius:8px 8px 0 8px; }
.bubble time { color:rgba(233,237,239,.55); }
.bubble.mine time { color:rgba(233,237,239,.6); }
.ticks.seen { color:#53BDEB !important; }
.ticks { color:#8696A0; }
.day-sep span { background:#182229; color:#E9EDEF; }
.composer { background:#202C33; border-top:0; }
.composer textarea { background:#2A3942; border:0; border-radius:20px; color:#E9EDEF; }
.composer textarea:focus { border-color:transparent; }
.send-btn { background:#25D366 !important; color:#111B21; box-shadow:0 2px 8px rgba(37,211,102,.35); }
.pill.primary { background:#25D366 !important; color:#111B21 !important; box-shadow:none; }
.badge { background:#25D366; color:#111B21; }
.login-page { background:#0B141A; }
.login-page::before { display:none; }
.login-card { background:#111B21; border:1px solid rgba(255,255,255,.08); }
.login-left { background:linear-gradient(135deg, #075E54, #128C7E); clip-path:none; }
.login-left p { color:#D9FDD3; }
.brand-mark { background:#25D366; box-shadow:0 8px 24px rgba(37,211,102,.4); }
.login-points svg { color:#25D366; }
.google-btn:hover:not(:disabled) { box-shadow:0 12px 28px rgba(37,211,102,.3); }
.emoji-panel { background:#233138; }
.modal { background:#233138; }
.modal .btns .primary { background:#25D366; color:#111B21; }
.announce-bar { background:rgba(37,211,102,.14); }
.pinned-bar { background:rgba(37,211,102,.14); border-left-color:#25D366; }
.quote { border-left-color:#25D366 !important; }
.ctx { border-left-color:#25D366; }
.mention { color:#25D366; background:rgba(37,211,102,.14); }
#adminBtn { color:#FFB020; }
/* V3 WhatsApp extras */
.wa-fab { position:absolute; right:18px; bottom:18px; width:56px; height:56px; border-radius:50%; background:#25D366; color:#111B21; font-size:26px; display:grid; place-items:center; box-shadow:0 6px 18px rgba(0,0,0,.45); z-index:5; }
.sidebar { position:relative; }
.v3-smart { display:flex; gap:6px; overflow-x:auto; padding:8px 16px 0; background:#202C33; scrollbar-width:none; }
.v3-smart::-webkit-scrollbar { display:none; }
.v3-chip { flex:none; padding:7px 13px; border-radius:20px; font-size:13px; background:#2A3942; border:1px solid rgba(255,255,255,.1); color:#E9EDEF; }
.v3-chip:hover { background:#25D366; color:#111B21; }
.v3-card { margin:8px 0; padding:12px; border-radius:12px; background:var(--glass-strong); border:1px solid var(--border); }
.v3-card h4 { margin:0 0 8px; font-size:14px; }
.v3-poll-opt { display:flex; align-items:center; gap:8px; width:100%; padding:8px 10px; border-radius:10px; background:var(--glass); border:1px solid var(--border); font-size:13.5px; text-align:left; margin:4px 0; }
.v3-poll-opt:hover { border-color:#25D366; }
.v3-poll-bar { height:6px; border-radius:3px; background:rgba(37,211,102,.35); margin-top:4px; }
.v3-loc { border:1px solid #25D366; }
.v3-stickers { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; margin:0 18px 8px; padding:8px; border-radius:14px; background:#233138; border:1px solid var(--border); }
.v3-stickers button { font-size:34px; padding:4px; border-radius:8px; line-height:1.2; }
.v3-stickers button:hover { background:var(--glass-strong); }
.v3-row { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0; }
.v3-live-dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#25D366; box-shadow:0 0 0 0 rgba(37,211,102,.6); animation:livepulse 1.6s ease-in-out infinite; }

const CLOUDINARY_CLOUD_NAME = 'lkeo0urf';
const CLOUDINARY_UPLOAD_PRESET = 'messageup';
const MEDIA_READY = CLOUDINARY_CLOUD_NAME !== 'CHANGE_ME_CLOUD_NAME' && CLOUDINARY_UPLOAD_PRESET !== 'CHANGE_ME_UPLOAD_PRESET';

async function uploadToCloudinary(blobOrFile, filename) {
  if (!MEDIA_READY) throw new Error('cloudinary-not-configured');
  const fd = new FormData();
  fd.append('file', blobOrFile, filename || 'upload');
  fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  let res;
  try { const upCtrl = new AbortController(); const upTimer = setTimeout(() => { try { upCtrl.abort(); } catch (e) {} }, 30000); try { res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, { method: 'POST', body: fd, signal: upCtrl.signal }); } finally { clearTimeout(upTimer); } }
  catch (e) { throw new Error('Network/CORS error — internet check korun.'); }
  if (!res.ok) {
    let msg = 'Upload failed (HTTP ' + res.status + ')';
    try { const j = await res.json(); if (j && j.error && j.error.message) msg = j.error.message; } catch (e) {}
    throw new Error(msg);
  }
  const data = await res.json();
  return { url: data.secure_url, resourceType: data.resource_type, format: data.format, bytes: data.bytes };
}

const VBADGE = '<svg class="vbadge" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="margin-left:3px"><path fill="#2f6bff" d="M12 1.5l2.6 1.9 3.2-.3.9 3.1 2.8 1.6-1 3.1 1 3.1-2.8 1.6-.9 3.1-3.2-.3L12 20.9l-2.6-2.5-3.2.3-.9-3.1-2.8-1.6 1-3.1-1-3.1 2.8-1.6.9-3.1 3.2.3z"/><path fill="#fff" d="M10.4 15.3L7 11.9l1.3-1.3 2.1 2.1 5.3-5.3 1.3 1.3z"/></svg>';
function isVerified(uid) { const u = usersById()[uid]; return !!(u && u.verified); }
function vbadgeFor(uid) { return isVerified(uid) ? VBADGE : ''; }

function partnerOf(chat, byId) {
  if (chat.isGroup) return { uid: chat.id, name: chat.name || 'Group', email: '', photoURL: '', lastSeen: null, isGroup: true, count: (chat.members || []).length };
  const otherUid = (chat.members || []).find((m) => m !== me.uid) || '';
  const info = (chat.memberInfo && chat.memberInfo[otherUid]) || {};
  const live = byId[otherUid] || {};
  return {
    uid: otherUid,
    name: live.name || info.name || info.email || 'User',
    email: live.email || info.email || '',
    photoURL: live.photoURL || info.photoURL || '',
    lastSeen: live.lastSeen || null,
  };
}

function viewChats() {
  const byId = usersById();
  return state.rawChats
    .filter((c) => c.lastMessage || c.id === state.activeId)
    .map((c) => ({ ...c, partner: partnerOf(c, byId), unreadCount: (c.unread && c.unread[me.uid]) || 0 }))
    .sort((a, b) => toMs(b.updatedAt) - toMs(a.updatedAt));
}

function currentPartner() {
  if (!state.activeId) return null;
  const c = viewChats().find((x) => x.id === state.activeId);
  if (c) return c.partner;
  const u = usersById()[state.activePartnerUid];
  if (u) return { uid: u.uid, name: u.name || 'User', email: u.email || '', photoURL: u.photoURL || '', lastSeen: u.lastSeen || null };
  return null;
}

function renderConvHeader() {
  const p = currentPartner();
  if (!p || !$('#convName')) return;
  const on = isActiveNow(p.lastSeen);
  $('#convAvatar').innerHTML = avatar(p.name, p.photoURL, 42, on && !((usersById()[p.uid] || {}).ghostMode));
  $('#convName').innerHTML = esc(p.name) + (!p.isGroup ? vbadgeFor(p.uid) : '');
  const st = $('#convStatus');
  const typing = partnerTyping(p);
  const live = usersById()[p.uid];
  const sfx = !p.isGroup && live && live.statusText ? ' · ' + live.statusText : '';
  st.textContent = (p.isGroup ? p.count + ' members' : typing ? 'typing...' : lastSeenText(p.lastSeen)) + sfx;
  st.className = on || typing ? 'status on' : 'status';
  clearTimeout(typTimer);
  if (typing) typTimer = setTimeout(renderConvHeader, 4600);
}

const QUICK = ['❤️', '😂', '👍', '😮', '😢', '🙏'];
function highlightSearch(html, term) {
  if (!term) return html;
  try {
    const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return html.replace(re, '<mark>$1</mark>');
  } catch (e) { return html; }
}
function renderMessages() {
  const box = $('#msgs');
  if (!box) return;
  const p = currentPartner();
  try { if (p && state.activeId && isVaultLocked(state.activeId) && !V2.vaultUnlocked.has(state.activeId)) { box.innerHTML = vaultLockedHtml(state.activeId); return; } } catch (e) {}
  const v3VisMsgs = v3VisibleMessages();
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  if (!v3VisMsgs.length) {
    box.innerHTML = `<div class="empty-hint">Say hi to ${esc(firstName(p ? p.name : ''))} 👋</div>`;
    return;
  }
  const chat = state.rawChats.find((x) => x.id === state.activeId);
  try { if (p && v3IsBlocked(p.uid) && !p.isGroup) { box.innerHTML = `<div class="empty-hint">🚫 Ei user ke block kora ache. Unblock korte chat menu (⋮) → Unblock.</div>`; return; } } catch (e) {}
  const seenMs = toMs(chat && chat.lastRead && p ? chat.lastRead[p.uid] : null);
  const term = state.searchTerm.trim().toLowerCase();
  let last = '';
  let html = '';
  v3VisMsgs.forEach((m) => {
    const label = dayLabel(m.createdAt);
    if (label && label !== last) { html += `<div class="day-sep"><span>${esc(label)}</span></div>`; last = label; }
    const mine = m.senderId === me.uid;
    const del = !!m.deleted;
    const t = toMs(m.createdAt);
    let inner = '';
    if (del) inner = '<p>🚫 Message deleted</p>';
    else {
      if (m.forwarded) inner += `<div class="quote" style="border-color:var(--muted)">↪ Forwarded</div>`;
      if (m.replyTo) inner += `<div class="quote">${esc(m.replyTo.text || '📷 Photo')}</div>`;
      if (m.viewOnce) inner += v4ViewOnceHtml(m);
      else if (m.imageUrl) inner += speedModeOn() ? `<button type="button" class="speed-placeholder" data-speed-img="${esc(m.imageUrl)}">📷 Tap to load image</button>` : `<img class="pic" src="${esc(m.imageUrl)}" alt="photo" loading="lazy" decoding="async">`;
      if (m.audioUrl) inner += `<audio controls preload="metadata" src="${esc(m.audioUrl)}"></audio>`;
      if (m.text) inner += m.sticker ? `<p style="font-size:38px;line-height:1.2">${esc(m.text)}</p>` : `<p>${term ? highlightSearch(renderWithMentions(m.text), term) : renderWithMentions(m.text)}</p>`;
      try { if (m.poll) inner += v3PollHtml(m); } catch (e) {}
      try { if (m.liveLoc) inner += `<div class="v3-card v3-loc">📍 Live location<br><span class="preview">${esc(m.liveLoc.name || 'Location')}</span><br><a href="https://www.openstreetmap.org/?mlat=${encodeURIComponent(m.liveLoc.lat)}&mlon=${encodeURIComponent(m.liveLoc.lng)}#map=15/${encodeURIComponent(m.liveLoc.lat)}/${encodeURIComponent(m.liveLoc.lng)}" target="_blank" rel="noopener">OpenStreetMap e dekhun ↗</a></div>`; } catch (e) {}
      try { const trK = m.id + '|' + translateTarget(); const trV = V2.translations[trK]; if (trV) inner += `<div class="v2-translation">🌐 ${trV === '…' ? 'Translating…' : esc(trV)}</div>`; } catch (e) {}
    }
    if (p && p.isGroup && !mine && !del) inner = `<div style="font-size:11px;font-weight:600;color:var(--red-2);margin-bottom:2px">${esc(senderName(m.senderId, chat))}${isVerified(m.senderId) ? ' ' + VBADGE : ''}</div>` + inner;
    const seen = (() => { try { if (!(t > 0)) return false; const lr = (chat && chat.lastRead) || {}; if (p && p.isGroup) { const others = ((chat && chat.members) || []).filter((u) => u !== me.uid); return others.length > 0 && others.every((u) => toMs(lr[u]) >= t); } return toMs(lr[p ? p.uid : '']) >= t; } catch (e) { return seenMs > 0 && seenMs >= t; } })();
    const tick = mine && !del ? `<span class="ticks${seen ? ' seen' : ' sent'}" title="${!t ? 'Sending…' : seen ? 'Seen' : 'Sent — partner ekhono kholeni'}">${!t ? '🕓' : seen ? '✓✓' : '✓'}</span>` : '';
    const edited = m.edited && !del ? ' · edited' : '';
    const imgOnly = !del && m.imageUrl && !m.text && !m.replyTo;

function squarePhotoCanvas(file) {
  return new Promise((resolve, reject) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(u);
      const side = Math.min(im.naturalWidth, im.naturalHeight), cv = document.createElement('canvas');
      cv.width = cv.height = 300;
      cv.getContext('2d').drawImage(im, (im.naturalWidth - side) / 2, (im.naturalHeight - side) / 2, side, side, 0, 0, 300, 300);
      resolve(cv);
    };
    im.onerror = () => { URL.revokeObjectURL(u); reject(new Error('bad image')); };
    im.src = u;
  });
}

async function squarePhotoPreview(file) {

// Final version used on Save: uploads to Cloudinary if configured, else falls back to base64.
async function squarePhoto(file) {
  const cv = await squarePhotoCanvas(file);
  if (MEDIA_READY) {
    const blob = await canvasToBlob(cv, 0.85);
    const r = await uploadToCloudinary(blob, 'avatar.jpg');
    return r.url;
  }
  return cv.toDataURL('image/jpeg', 0.7);
}

async function toggleRec() {
  if (rec) { rec.stop(); return; }
  if (state.sending || !state.activeId) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast('Ei browser e voice record kora jay na.'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { toast('Mic permission din.'); return; }
  const chatId = state.activeId, partner = currentPartner(), t0 = Date.now(), chunks = [];
  const mr = new MediaRecorder(stream, { audioBitsPerSecond: 24000 });
  rec = mr;
  let transcript = '';
  let speech = null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    try {
      speech = new SR();
      speech.continuous = true; speech.interimResults = false; speech.lang = 'bn-BD';
      speech.onresult = (ev) => { for (let i = ev.resultIndex; i < ev.results.length; i++) { if (ev.results[i].isFinal) transcript += ev.results[i][0].transcript + ' '; } };
      speech.onerror = () => {};
      speech.start();
    } catch (e) { speech = null; }
  }
  mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    clearTimeout(recTimer);
    stream.getTracks().forEach((t) => t.stop());
    if (speech) { try { speech.stop(); } catch (e) {} }
    rec = null;
    const b = $('#micBtn'); if (b) { b.textContent = '🎤'; b.style.color = ''; }
    if (Date.now() - t0 < 700 || state.activeId !== chatId || !partner || state.sending) return;
    state.sending = true;
    try {
      const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
      let url;
      if (MEDIA_READY) { url = (await uploadToCloudinary(blob, 'voice.webm')).url; }
      else {
        url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
        if (url.length > 850000) { toast('Voice onek boro. Choto kore pathan (ba Cloudinary setup korun).'); return; }
      }
      const batch = writeBatch(db);
      const msgData = { text: transcript.trim(), audioUrl: url, senderId: me.uid, createdAt: serverTimestamp() };
      batch.set(doc(collection(db, 'chats', chatId, 'messages')), msgData);
      batch.update(doc(db, 'chats', chatId), { lastMessage: { text: '🎤 Voice message', senderId: me.uid }, updatedAt: serverTimestamp(), ...unreadInc(partner, chatId) });
      await batch.commit();
    } catch (e) { console.error(e); toast('Voice pathano jayni. Abar try korun.'); }
    finally { state.sending = false; }
  };
  mr.start();
  recTimer = setTimeout(() => { if (mr.state === 'recording') mr.stop(); }, 60000);
  const b = $('#micBtn'); if (b) { b.textContent = '⏹'; b.style.color = '#ff4d6d'; }
}

/* ===== calls, share, group info ===== */
let call = null, incoming = null;
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
const setStat = (t) => { const e = call && call.el.querySelector('#cStat'); if (e) e.textContent = t; };
function callUI(name, photo, text) {
  const el = document.createElement('div');
  el.className = 'call';
  el.innerHTML = `<video class="cremote" id="cRemote" autoplay playsinline></video><video class="clocal" id="cLocal" autoplay playsinline muted></video><div class="cinfo">${avatar(name, photo, 84)}<h2 style="margin:6px 0 0">${esc(name)}</h2><div id="cStat">${esc(text)}</div></div><div class="cbtns" id="cBtns"></div>`;
  document.body.appendChild(el);
  return el;
}
function addCand(c) {
  if (!call) return;
  if (call.pc.remoteDescription) call.pc.addIceCandidate(c).catch(() => {}); else call.pending.push(c);
}
function flushCands() { if (call) call.pending.splice(0).forEach((c) => call.pc.addIceCandidate(c).catch(() => {})); }
function newCall(id, stream, type, u, caller) {
  const pc = new RTCPeerConnection(ICE);
  const el = callUI(u.name || 'User', u.photoURL, caller ? 'Calling...' : 'Connecting...');
  el.classList.toggle('vid', type === 'video');
  const c = { id, pc, stream, type, el, unsubs: [], pending: [], timer: null };
  stream.getTracks().forEach((t) => pc.addTrack(t, stream));
  el.querySelector('#cLocal').srcObject = stream;
  pc.ontrack = (e) => { el.querySelector('#cRemote').srcObject = e.streams[0]; el.classList.add('live'); setStat('Connected'); };
  pc.onicecandidate = (e) => { if (e.candidate) addDoc(collection(db, 'calls', id, 'ice'), { uid: me.uid, c: JSON.stringify(e.candidate) }).catch(() => {}); };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed') { toast('Call connect hoyni (network).'); endCall(true); }
    else if (pc.connectionState === 'disconnected') setStat('Reconnecting...');
    else if (pc.connectionState === 'connected') setStat('Connected');
  };
  c.unsubs.push(onSnapshot(collection(db, 'calls', id, 'ice'), (sn) => {
    sn.docChanges().forEach((ch) => { if (ch.type === 'added') { const d = ch.doc.data(); if (d.uid !== me.uid) addCand(JSON.parse(d.c)); } });
  }, () => {}));
  el.querySelector('#cBtns').innerHTML = `<button type="button" data-c="mute">🎙</button>${type === 'video' ? '<button type="button" data-c="cam">📹</button>' : ''}<button type="button" data-c="end" class="end">📵</button>`;
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-c]');
    if (!b) return;
    const k = b.dataset.c;
    if (k === 'end') endCall(true);
    else if (k === 'mute') { const t = stream.getAudioTracks()[0]; if (t) { t.enabled = !t.enabled; b.textContent = t.enabled ? '🎙' : '🔇'; } }
    else if (k === 'cam') { const t = stream.getVideoTracks()[0]; if (t) { t.enabled = !t.enabled; b.textContent = t.enabled ? '📹' : '🚫'; } }
  });
  return c;
}
function endCall(notify) {
  const c = call;
  if (!c) return;
  call = null;
  clearTimeout(c.timer);
  c.unsubs.forEach((f) => f());
  try { c.stream.getTracks().forEach((t) => t.stop()); c.pc.close(); } catch (e) {}
  c.el.remove();
  if (notify) updateDoc(doc(db, 'calls', c.id), { status: 'ended' }).catch(() => {});
}
async function startCall(uid, type) {
  if (call || incoming) { toast('Ekta call chalu ache.'); return; }
  const u = usersById()[uid];
  if (!u) return;
  if (!navigator.mediaDevices || !window.RTCPeerConnection) { toast('Ei browser e call hobe na.'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'video' }); } catch (e) { toast('Mic/Camera permission din.'); return; }
  const ref = doc(collection(db, 'calls'));
  call = newCall(ref.id, stream, type, u, true);
  try {
    const offer = await call.pc.createOffer();
    await call.pc.setLocalDescription(offer);
    await setDoc(ref, { from: me.uid, to: uid, type, status: 'ringing', offer: { type: offer.type, sdp: offer.sdp }, createdAt: serverTimestamp() });
  } catch (e) { console.error(e); endCall(false); toast('Call shuru hoyni. Firestore rules check korun.'); return; }
  call.unsubs.push(onSnapshot(ref, async (sn) => {
    const d = sn.data();
    if (!d || !call) return;
    try {
      if (d.answer && !call.pc.remoteDescription) { await call.pc.setRemoteDescription(d.answer); flushCands(); setStat('Connecting...'); }
    } catch (e) { console.error(e); }
    if (d.status === 'declined') { toast('Call decline kora hoyeche.'); endCall(false); }
    else if (d.status === 'ended') endCall(false);
  }));
  call.timer = setTimeout(() => { if (call && !call.pc.remoteDescription) { toast('Kew call dhoreni.'); endCall(true); } }, 45000);
}
function closeIncoming() { if (!incoming) return; clearInterval(incoming.ring); incoming.el.remove(); incoming = null; }
function showIncoming(d) {
  const u = usersById()[d.from] || {};
  const el = callUI(u.name || 'User', u.photoURL, d.type === 'video' ? '🎥 Incoming video call' : '📞 Incoming voice call');

function onIncomingCalls() {

async function acceptCall(d) {

  call = newCall(d.id, stream, d.type, u, false);

/* ===== group video call + live broadcast (WebRTC mesh, beta, ~4-6 people) ===== */
let gcall = null;
const pairIdFor = (a, b) => [a, b].sort().join('_');
function makeGPeer(uid) {
  const pc = new RTCPeerConnection(ICE);
  const peer = { pc, pending: [], stream: null };
  gcall.peers[uid] = peer;
  pc.ontrack = (e) => { peer.stream = e.streams[0]; renderGcallTiles(); };
  pc.onicecandidate = (e) => { if (e.candidate && gcall) addDoc(collection(db, 'calls', gcall.callId, 'pairs', pairIdFor(me.uid, uid), 'ice'), { uid: me.uid, c: JSON.stringify(e.candidate) }).catch(() => {}); };
  return pc;
}
function listenPairIce(pid, uid) {
  const un = onSnapshot(collection(db, 'calls', gcall.callId, 'pairs', pid, 'ice'), (sn) => {
    sn.docChanges().forEach((ch) => {
      if (ch.type !== 'added' || !gcall) return;
      const d = ch.doc.data();
      if (d.uid === me.uid) return;
      const peer = gcall.peers[uid];
      if (!peer) return;
      const cand = JSON.parse(d.c);
      if (peer.pc.remoteDescription) peer.pc.addIceCandidate(cand).catch(() => {}); else peer.pending.push(cand);
    });
  }, () => {});
  gcall.unsubs.push(un);
}
function flushGPeerCands(uid) { const peer = gcall && gcall.peers[uid]; if (peer) peer.pending.splice(0).forEach((c) => peer.pc.addIceCandidate(c).catch(() => {})); }
async function offerPair(uid) {
  const pc = makeGPeer(uid);
  if (!gcall.viewerOnly) gcall.stream.getTracks().forEach((t) => pc.addTrack(t, gcall.stream));
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  const pid = pairIdFor(me.uid, uid);
  await setDoc(doc(db, 'calls', gcall.callId, 'pairs', pid), { from: me.uid, to: uid, offer: { type: offer.type, sdp: offer.sdp }, answer: null });
  listenPairIce(pid, uid);
}
async function answerPair(pid, p) {
  const uid = p.from;
  const pc = makeGPeer(uid);
  if (!gcall.viewerOnly) gcall.stream.getTracks().forEach((t) => pc.addTrack(t, gcall.stream));
  await pc.setRemoteDescription(p.offer);
  const ans = await pc.createAnswer();
  await pc.setLocalDescription(ans);
  await updateDoc(doc(db, 'calls', gcall.callId, 'pairs', pid), { answer: { type: ans.type, sdp: ans.sdp } });
  listenPairIce(pid, uid);
}
function removeGPeer(uid) {
  const peer = gcall && gcall.peers[uid];
  if (!peer) return;
  try { peer.pc.close(); } catch (e) {}
  delete gcall.peers[uid];
}
function buildGcallUI() {
  const el = document.createElement('div');
  el.className = 'call vid';
  el.style.cssText = 'position:fixed;inset:0;z-index:50;background:#000';
  el.innerHTML = `<div class="call-grid"></div><div style="position:absolute;top:max(14px,env(safe-area-inset-top));left:14px"><span id="gcCount" style="font-size:12.5px;color:#fff;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:10px">${gcall.isLive ? '🔴 LIVE' : 'Group call'}</span></div><div class="cbtns" id="gcBtns"></div>`;
  document.body.appendChild(el);
  const btns = [];
  if (!gcall.viewerOnly) btns.push('<button type="button" data-gc="mute">🎙</button>', '<button type="button" data-gc="cam">📹</button>');
  btns.push(`<button type="button" data-gc="end" class="end">${gcall.viewerOnly ? '✕' : '📵'}</button>`);
  el.querySelector('#gcBtns').innerHTML = btns.join('');

}
function renderGcallTiles() {
  if (!gcall) return;

  if (!grid) return;

async function joinGroupCall(callId, chatId, opts) {
  if (gcall) { toast('Ekta call already cholche.'); return; }
  opts = opts || {};
  if (!navigator.mediaDevices || !window.RTCPeerConnection) { toast('Ei browser e call hobe na.'); return; }
  let stream;
  try {
    stream = opts.viewerOnly ? new MediaStream() : await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
  } catch (e) { toast('Mic/Camera permission din.'); return; }
  const callRef = doc(db, 'calls', callId);
  const snap = await getDoc(callRef);
  if (!snap.exists() || snap.data().status === 'ended') { toast('Call ar active nai.'); stream.getTracks().forEach((t) => t.stop()); return; }
  const data = snap.data();
  const existing = (data.participants || []).filter((u) => u !== me.uid);
  gcall = { callId, chatId, isLive: !!data.isLive, hostUid: data.hostUid, viewerOnly: !!opts.viewerOnly, stream, peers: {}, unsubs: [], el: null };
  gcall.el = buildGcallUI();
  renderGcallTiles();
  gcall.unsubs.push(onSnapshot(callRef, (sn) => {
    if (!gcall) return;
    if (!sn.exists()) { leaveGroupCall(false); return; }
    const d = sn.data();
    const parts = d.participants || [];
    Object.keys(gcall.peers).forEach((uid) => { if (!parts.includes(uid)) removeGPeer(uid); });
    if (d.status === 'ended') { toast(gcall.isLive ? 'Live sesh hoyeche.' : 'Call sesh hoyeche.'); leaveGroupCall(false); return; }
    renderGcallTiles();
  }));
  gcall.unsubs.push(onSnapshot(collection(db, 'calls', callId, 'pairs'), (sn) => {
    if (!gcall) return;
    sn.docChanges().forEach((ch) => {
      const p = ch.doc.data(), pid = ch.doc.id;
      if (p.to === me.uid && !gcall.peers[p.from]) answerPair(pid, p).catch((e) => console.error(e));
      else if (p.from === me.uid && gcall.peers[p.to] && p.answer && !gcall.peers[p.to].pc.remoteDescription) {
        gcall.peers[p.to].pc.setRemoteDescription(p.answer).then(() => flushGPeerCands(p.to)).catch((e) => console.error(e));
      }
    });
  }));

}
async function leaveGroupCall(notify) {

      await updateDoc(doc(db, 'calls', g.callId), { participants: arrayRemove(me.uid) });
      if (!remaining.length || (g.isLive && g.hostUid === me.uid)) {
        await updateDoc(doc(db, 'calls', g.callId), { status: 'ended' }).catch(() => {});
        if (g.chatId) updateDoc(doc(db, 'chats', g.chatId), { activeCallId: deleteField() }).catch(() => {});

  }
}

/* ===== Reels (Instagram-style vertical video feed, with "For You" ranking) ===== */
let reelsObserver = null, reelsCursorDoc = null, reelsExhausted = false, reelsShownIds = new Set(), reelsLoading = false, reelsWatchTimer = null, reelsCountedViews = new Set();
function getInterests() { try { return JSON.parse(localStorage.getItem('mu-interests') || '{}'); } catch (e) { return {}; } }
function bumpInterest(cat, amt) {
  if (!cat) return;
  const m = getInterests();
  m[cat] = (m[cat] || 0) + amt;
  try { localStorage.setItem('mu-interests', JSON.stringify(m)); } catch (e) {}
}
function reelScore(p) {
  const likes = p.likes ? Object.keys(p.likes).length : 0;
  const comments = p.commentCount || 0;
  const views = p.viewCount || 0;
  const ageH = Math.max(1, (Date.now() - toMs(p.createdAt)) / 3600000);
  const virality = (likes * 3 + comments * 2 + views * 0.3) / Math.pow(ageH, 0.6);
  const interestW = Math.min(getInterests()[p.category || 'General'] || 0, 6);
  return virality * (1 + interestW * 0.35) + Math.random() * 0.6;
}
function rankReels(list) { return list.slice().sort((a, b) => reelScore(b) - reelScore(a)); }
async function fetchReelsBatch() {
  if (reelsExhausted || reelsLoading) return [];
  reelsLoading = true;
  try {
    let qy = query(collection(db, 'posts'), orderBy('createdAt', 'desc'), limit(40));
    if (reelsCursorDoc) qy = query(collection(db, 'posts'), orderBy('createdAt', 'desc'), startAfter(reelsCursorDoc), limit(40));
    const sn = await getDocs(qy);
    if (sn.empty) { reelsExhausted = true; return []; }
    reelsCursorDoc = sn.docs[sn.docs.length - 1];
    if (sn.docs.length < 40) reelsExhausted = true;
    return sn.docs.map((d) => ({ id: d.id, ...d.data() })).filter((p) => p.videoUrl && !reelsShownIds.has(p.id));
  } catch (e) { console.error(e); reelsExhausted = true; return []; }
  finally { reelsLoading = false; }
}
function reelItem(p) {
  const u = usersById()[p.uid] || {};
  const liked = p.likes && p.likes[me.uid];
  const n = p.likes ? Object.keys(p.likes).length : 0;
  return `<section class="reel" data-cat="${esc(p.category || 'General')}" data-id="${esc(p.id)}"><video src="${esc(p.videoUrl)}" loop playsinline muted preload="metadata"></video>
    <div class="reel-info"><div class="prow" data-pa="prof" data-u="${esc(p.uid)}" style="color:#fff">${avatar(u.name, u.photoURL, 36)}<strong>${esc(u.name || 'User')}${vbadgeFor(p.uid)}</strong>${p.category ? `<span style="font-size:11px;opacity:.75">#${esc(p.category)}</span>` : ''}</div>${p.text ? `<p>${renderWithMentions(p.text)}</p>` : ''}</div>
    <div class="reel-acts">${pb('like', liked ? '❤️' : '🤍', `data-id="${esc(p.id)}"`)}<span style="color:#fff;font-size:11px;margin-top:-10px">${n || ''}</span>${pb('cmt', '💬', `data-id="${esc(p.id)}"`)}${pb('share', '↪', `data-id="${esc(p.id)}"`)}${pb('save', state.starredIds.has('reels_' + p.id) ? '🔖' : '📑', `data-id="${esc(p.id)}"`)}</div></section>`;
}
function appendReelSections(bg, list) {
  list.forEach((p) => reelsShownIds.add(p.id));
  const html = list.map(reelItem).join('');
  if (!html) return;
  bg.insertAdjacentHTML('beforeend', html);
  bg.querySelectorAll('.reel').forEach((r) => { if (!r.dataset.obs) { r.dataset.obs = '1'; reelsObserver.observe(r); } });
}
async function loadMoreReels(bg) {
  const fresh = await fetchReelsBatch();
  if (fresh.length) appendReelSections(bg, rankReels(fresh));
  else reelsExhausted = true;
}
function openReels() {
  reelsCursorDoc = null; reelsExhausted = false; reelsShownIds = new Set(); reelsCountedViews = new Set();
  const fs = friendSet();
  const already = state.posts.filter((p) => p.videoUrl && (fs.has(p.uid) || p.uid === me.uid));
  already.forEach((p) => reelsShownIds.add(p.id));
  const bg = document.createElement('div');
  bg.className = 'reels-wrap';
  bg.innerHTML = `<button type="button" class="icon-btn reels-close" id="reelsClose" aria-label="Close">${svg(ICON.back, 20)}</button>`;
  document.body.appendChild(bg);
  reelsObserver = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      const v = en.target.querySelector('video');
      if (!v) return;
      if (en.isIntersecting && en.intersectionRatio > 0.6) {
        v.play().catch(() => {});
        const pid = en.target.dataset.id, cat = en.target.dataset.cat;
        clearTimeout(reelsWatchTimer);
        reelsWatchTimer = setTimeout(() => {
          bumpInterest(cat, 1);
          if (!reelsCountedViews.has(pid)) { reelsCountedViews.add(pid); updateDoc(doc(db, 'posts', pid), { viewCount: increment(1) }).catch(() => {}); }
        }, 2500);
      } else v.pause();
    });
    const last = bg.querySelectorAll('.reel');
    if (last.length) {
      const lastEl = last[last.length - 1];
      const r = lastEl.getBoundingClientRect();
      if (r.top < window.innerHeight * 2.5) loadMoreReels(bg);
    }
  }, { threshold: [0, 0.6, 1] });
  appendReelSections(bg, rankReels(already));
  (async () => {
    await loadMoreReels(bg);
    if (!bg.querySelector('.reel[data-id]')) {
      bg.insertAdjacentHTML('beforeend', '<section class="reel"><div class="list-empty" style="color:#fff">Kono video pawa jayni. Feed theke 📷/🎥 button diye video post korun.</div></section>');
    }
  })();

function beep() {
  if (!soundOn()) return;
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    audioCtx = audioCtx || new A();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(t + 0.25);
  } catch (e) {}
}

function shrinkImageCanvas(file, maxSide) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
      const w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const cx = cv.getContext('2d');
      cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);
      resolve(cv);
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    im.src = url;
  });
}
function canvasToDataUrl(cv) {
  let q = 0.72, out = cv.toDataURL('image/jpeg', q);
  while (out.length > 600000 && q > 0.3) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
  if (out.length > 800000) throw new Error('too big');
  return out;
}
function canvasToBlob(cv, q) {
  return new Promise((res) => cv.toBlob(res, 'image/jpeg', q));
}
// Returns a usable URL for an image: uploads to Cloudinary if configured, otherwise falls back to a compressed base64 data URL (works, but heavier on Firestore).
async function shrinkImage(file) {
  const cv = await shrinkImageCanvas(file, 900);
  if (MEDIA_READY) {
    const blob = await canvasToBlob(cv, 0.82);
    const r = await uploadToCloudinary(blob, 'image.jpg');
    return r.url;
  }
  return canvasToDataUrl(cv);
}
// Video upload (Cloudinary only — too big for Firestore). Throws if not configured.
async function uploadVideoFile(file) {
  if (!MEDIA_READY) throw new Error('cloudinary-not-configured');
  if (file.size > 60 * 1024 * 1024) throw new Error('too-big');
  const r = await uploadToCloudinary(file, file.name || 'video.mp4');
  return r.url;
}

/* ---------- 1. Smart Inbox (local, rule-based) ---------- */
function inboxKeywords(text) {
  try {
    const s = String(text || '').toLowerCase();
    const found = [];
    const groups = [
      ['taka', ['taka', 'money', 'payment', 'bill', 'salary', 'tk', '৳']],
      ['meeting', ['meeting', 'call', 'zoom', 'class', 'exam']],
      ['urgent', ['urgent', 'joruri', 'emergency', 'asap']],
      ['photo', ['photo', 'chobi', 'pic', 'image']],
      ['party', ['party', 'birthday', 'wedding']],
    ];
    groups.forEach(([label, words]) => { if (words.some((w) => s.includes(w))) found.push(label); });
    return found.slice(0, 3);
  } catch (e) { return []; }
}
function smartInboxCard() {

    if (!unread.length) return '';

    const kw = [];

    return `<div class="v2-inbox">📥 <strong>Smart Inbox:</strong> ${total} unread · ${unread.length} chat${unread.length > 1 ? 's' : ''}${kw.length ? ' · Topics: ' + kw.join(', ') : ''}</div>`;

async function translateMessage(m) {
  try {
    if (!m || !m.text) { toast('Translate korar moto text nai.'); return; }

    if (V2.translations[key] && V2.translations[key] !== '…') { renderMessages(); return; }

      const data = await res.json();

  } catch (e) {

/* ---------- 5. Vault Chat (PIN hash in localStorage only) ---------- */
async function sha256Hex(str) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(str)));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 0; const s = String(str); for (let i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
    return 'fallback-' + Math.abs(h);
  }
}
function vaultKey(chatId) { return 'mu-vault-' + chatId; }
function isVaultLocked(chatId) { try { return !!localStorage.getItem(vaultKey(chatId)); } catch (e) { return false; } }

}

    document.body.appendChild(bg);

async function v3VotePoll(msgId, idx) {

/* ---------- Chat Export ---------- */
function v3ExportChat() {

  } catch (e) { toast('Export hoyni.'); }
}

      try {

        V3.liveLocs = map;
        try { renderMessages(); } catch (e) {}
      } catch (e) {}
    }, (err) => { try { console.error(err); } catch (e) {} });
    try { extraUnsubs.push(() => { try { if (V3.liveUnsub) V3.liveUnsub(); V3.liveUnsub = null; } catch (e) {} }); } catch (e) {}
  } catch (e) {}
}

function openV3LiveLocation() {
  try {
    if (!('geolocation' in navigator)) { toast('Ei browser e location supported na.'); return; }
    const bg = v3OpenSheet('📍 Live Location', `<p class="preview">Apnar live location <strong>shudhu apnar consent e</strong> share hobe, ar expiry er por auto bondho hoye jabe. Kokhono consent chara track kora hoy na.</p><div class="v3-row"><button type="button" class="pill primary" data-locmin="15">Share 15 min</button><button type="button" class="pill primary" data-locmin="60">Share 60 min</button><button type="button" class="pill" data-locmin="0">Stop sharing</button></div><p class="preview">Receiver chat e “📍 Live location” card + OpenStreetMap link dekhbe.</p>`);
    if (!bg) return;
    bg.addEventListener('click', (e) => {
      try {
        const b = e.target.closest('[data-locmin]');
        if (!b) return;
        const mins = parseInt(b.dataset.locmin, 10);
        if (mins === 0) { v3LiveLocationStop(); bg.remove(); return; }
        v3Busy(b, true);
        navigator.geolocation.getCurrentPosition(async (pos) => {
          try {
            const lat = pos.coords.latitude, lng = pos.coords.longitude;
            const expiresAt = Timestamp.fromMillis(Date.now() + mins * 60000);
            await setDoc(doc(db, 'liveLocations', me.uid), { uid: me.uid, name: me.displayName || me.email || 'User', lat, lng, expiresAt, updatedAt: serverTimestamp() });
            if (state.activeId) {
              try {
                const p = currentPartner();
                const batch = writeBatch(db);
                const msgRef = doc(collection(db, 'chats', state.activeId, 'messages'));
                batch.set(msgRef, { text: '📍 Live location (' + mins + ' min)', senderId: me.uid, createdAt: serverTimestamp(), liveLoc: { lat, lng, name: 'Live location (' + mins + ' min)' } });
                batch.update(doc(db, 'chats', state.activeId), { lastMessage: { text: '📍 Live location', senderId: me.uid }, updatedAt: serverTimestamp(), ...(p ? unreadInc(p, state.activeId) : {}) });
                await batch.commit();
              } catch (er) {}
            }
            try { if (V3.liveTimer) clearTimeout(V3.liveTimer); V3.liveTimer = setTimeout(() => { try { v3LiveLocationStop(); } catch (e) {} }, mins * 60000); } catch (e) {}
            toast('📍 Live location share hocche (' + mins + ' min) ✓'); bg.remove(); renderMessages();
          } catch (er) { toast('Location share hoyni. Rules check korun.'); }
          finally { v3Busy(b, false); }
        }, () => { toast('Location permission din, tahole share hobe.'); v3Busy(b, false); }, { timeout: 10000, maximumAge: 0 });
      } catch (er) { toast('Location share hoyni.'); }
    });
  } catch (e) { toast('Live location khola jayni.'); }
}
async function v3LiveLocationStop() {
  try {
    if (V3.liveTimer) { clearTimeout(V3.liveTimer); V3.liveTimer = null; }
    await deleteDoc(doc(db, 'liveLocations', me.uid));

/* ---------- SmartReply (local rule-based) ---------- */
function v3SmartReplyChips() {
  try {
    const msgs = state.messages || [];
    let last = '';
    for (let i = msgs.length - 1; i >= 0; i--) { if (msgs[i] && msgs[i].senderId !== me.uid && msgs[i].text) { last = String(msgs[i].text).toLowerCase(); break; } }
    if (!last) return ['👍 Okay', '🙏 Dhonnobad', '📞 Pore kotha hobe'];
    if (last.includes('?') || last.includes('kobe') || last.includes('kokhon')) return ['👍 Hya', '🤔 Dekhi, janacchi', '📞 Pore kotha hobe'];
    if (last.includes('kemon') || last.includes('kemon acho') || last.includes('kmn')) return ['😊 Bhalo, tumi?', '👍 Alhamdulillah bhalo', '🙏 Dhonnobad'];
    if (last.includes('thank') || last.includes('dhonnobad') || last.includes('thanks')) return ['🙏 Welcome', '😊 Kono bepar na', '👍 Okay'];
    if (last.includes('meeting') || last.includes('call') || last.includes('kotha')) return ['📞 Pore kotha hobe', '👍 Okay, call dio', '🕐 10 min por?'];
    if (last.includes('ok') || last.includes('thik') || last.includes('done')) return ['👍 Okay', '✅ Done', '🙏 Dhonnobad'];
    if (last.includes('love') || last.includes('bhalo') || last.includes('miss')) return ['❤️ Amio', '😊 Bhalo laglo', '🙏 Dhonnobad'];
    return ['👍 Okay', '🙏 Dhonnobad', '📞 Pore kotha hobe'];
  } catch (e) { return ['👍 Okay', '🙏 Dhonnobad', '📞 Pore kotha hobe']; }
}

   MESSAGE UP V4 — ADMIN FIX + PIC LAYOUT + WHATSAPP PHONE
