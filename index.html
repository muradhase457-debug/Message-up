<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070709" />
<title>Message Up</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e11d48'/%3E%3Cpath d='M16 22a6 6 0 0 1 6-6h20a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6H31l-9 8v-8a6 6 0 0 1-6-6z' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #07070a;
  --text: #f4f4f6;
  --muted: #9a9aa6;
  --red: #e11d48;
  --red-2: #ff4d6d;
  --blue: #2f6bff;
  --blue-2: #1f55e0;
  --glass: rgba(255, 255, 255, 0.05);
  --glass-strong: rgba(255, 255, 255, 0.09);
  --border: rgba(255, 255, 255, 0.1);
  --green: #22c55e;
  font-family: 'Poppins', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:disabled { cursor: not-allowed; }

/* ---------- common ---------- */
.splash { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
.spinner {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.15); border-top-color: var(--red-2);
  animation: spin 0.8s linear infinite;
}
.spinner.small { width: 18px; height: 18px; border-width: 2px; border-top-color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }

.setup-card {
  max-width: 520px; padding: 28px; border-radius: 18px;
  background: var(--glass); border: 1px solid var(--border); line-height: 1.6;
}
.setup-card h1 { margin-top: 0; font-size: 22px; }
.setup-card code { background: rgba(255,255,255,.1); padding: 2px 6px; border-radius: 6px; }

.avatar {
  position: relative; flex: none; border-radius: 50%;
  background: linear-gradient(135deg, #3b3b4a, #23232d);
  display: grid; place-items: center; font-weight: 600;
}
.avatar span { position: relative; }
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.online-dot {
  position: absolute; right: 0; bottom: 0; width: 25%; height: 25%; min-width: 9px; min-height: 9px;
  background: var(--green); border: 2px solid #15151b; border-radius: 50%;
}

.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  color: var(--muted); flex: none; transition: background 0.15s, color 0.15s;
}
.icon-btn:hover { background: var(--glass-strong); color: var(--text); }

/* ---------- login ---------- */
.login-page {
  min-height: 100dvh; display: grid; place-items: center; padding: 20px; position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse 80% 55% at 50% 115%, rgba(225, 29, 72, 0.5), transparent 65%),
    radial-gradient(ellipse 60% 40% at 50% -10%, rgba(225, 29, 72, 0.16), transparent 60%),
    #070709;
}
.login-page::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(225, 29, 72, 0.14) 1px, transparent 1px),
    linear-gradient(90deg, rgba(225, 29, 72, 0.14) 1px, transparent 1px);
  background-size: 70px 70px;
  -webkit-mask-image: radial-gradient(ellipse at center, #000 10%, transparent 75%);
  mask-image: radial-gradient(ellipse at center, #000 10%, transparent 75%);
}
.glow-dot {
  position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--red-2);
  box-shadow: 0 0 14px 4px rgba(255, 77, 109, 0.8); animation: pulse 2.6s ease-in-out infinite;
}
.glow-dot.d1 { top: 22%; left: 12%; }
.glow-dot.d2 { bottom: 24%; right: 10%; animation-delay: 0.9s; }
.glow-dot.d3 { top: 14%; right: 24%; animation-delay: 1.6s; }
@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

.login-card {
  position: relative; z-index: 1; width: min(880px, 100%); min-height: 420px;
  display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border-radius: 22px;
  background: rgba(45, 8, 16, 0.55); border: 1px solid rgba(255, 255, 255, 0.12);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.login-left {
  display: flex; flex-direction: column; justify-content: center; padding: 40px 56px 40px 40px;
  background: linear-gradient(135deg, rgba(225, 29, 72, 0.32), rgba(120, 10, 30, 0.1));
  clip-path: polygon(0 0, 100% 0, 84% 100%, 0 100%);
}
.brand-mark {
  width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 18px;
  background: linear-gradient(135deg, var(--red-2), #c9184a); box-shadow: 0 8px 24px rgba(225, 29, 72, 0.45);
}
.login-left h1 { margin: 0 0 10px; font-size: 30px; letter-spacing: 0.5px; }
.login-left p { margin: 0; color: #e7c9cf; font-size: 14px; line-height: 1.6; }

.login-right { display: flex; flex-direction: column; justify-content: center; padding: 40px; }
.login-right h2 { margin: 0 0 4px; font-size: 28px; }
.login-sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
.google-btn {
  display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; height: 50px;
  border-radius: 12px; background: #fff; color: #1f1f1f; font-weight: 600; font-size: 15px;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35); transition: transform 0.15s, box-shadow 0.15s;
}
.google-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(225, 29, 72, 0.35); }
.google-btn:disabled { opacity: 0.75; }
.google-btn .spinner.small { border-color: rgba(0,0,0,.15); border-top-color: #333; }
.form-error {
  margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5;
  background: rgba(225, 29, 72, 0.15); border: 1px solid rgba(225, 29, 72, 0.5); color: #ffc2cd;
}
.login-points { list-style: none; margin: 26px 0 0; padding: 0; display: grid; gap: 8px; color: var(--muted); font-size: 13px; }
.login-points li { display: flex; align-items: center; gap: 8px; }
.login-points svg { color: var(--red-2); }

/* ---------- chat ---------- */
.chat-page {
  height: 100dvh; display: grid; place-items: center; padding: 16px;
  background:
    radial-gradient(ellipse 60% 50% at 20% 0%, rgba(47, 107, 255, 0.18), transparent 60%),
    radial-gradient(ellipse 50% 40% at 100% 100%, rgba(120, 60, 255, 0.14), transparent 60%),
    #0a0a0f;
}
.shell {
  width: min(1180px, 100%); height: min(780px, 100%);
  display: grid; grid-template-columns: 380px minmax(0, 1fr); overflow: hidden; border-radius: 26px;
  background: rgba(24, 24, 32, 0.78); border: 1px solid var(--border);
  -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
}

.sidebar { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--border); padding: 18px 14px 8px; }
.me-row { display: flex; align-items: center; gap: 10px; padding: 0 4px 14px; }
.me-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.me-info strong, .me-info span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-info strong { font-size: 15px; }
.me-info span { font-size: 12px; color: var(--muted); }

.search-box {
  display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border-radius: 12px;
  background: var(--glass); border: 1px solid var(--border); color: var(--muted);
}
.search-box input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: 14px; }
.search-box input::placeholder { color: var(--muted); }
.search-box:focus-within { border-color: rgba(47, 107, 255, 0.7); }

.recent-row { display: flex; gap: 14px; overflow-x: auto; padding: 14px 4px 4px; scrollbar-width: none; }
.recent-row::-webkit-scrollbar { display: none; }
.recent-item { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); width: 52px; }
.recent-item span { max-width: 52px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tabs { display: flex; gap: 6px; margin: 14px 0 6px; padding: 4px; border-radius: 12px; background: var(--glass); }
.tab {
  flex: 1; height: 34px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--muted);
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s, color 0.15s;
}
.tab.active { background: var(--glass-strong); color: var(--text); }

.badge {
  font-style: normal; font-size: 11px; font-weight: 600; min-width: 20px; height: 20px; padding: 0 6px;
  border-radius: 10px; display: inline-grid; place-items: center; background: var(--blue); color: #fff;
}

.list { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
.list-empty { padding: 28px 14px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border-radius: 14px; text-align: left;
  transition: background 0.15s;
}
.row:hover { background: var(--glass); }
.row.active { background: var(--glass-strong); }
.row-main { flex: 1; min-width: 0; }
.row-top, .row-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.row-top strong { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-top time { font-size: 11px; color: var(--muted); flex: none; }
.preview { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preview.unread { color: var(--text); font-weight: 500; }
.row-bottom { margin-top: 2px; }

/* conversation */
.conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: rgba(10, 10, 15, 0.35); }
.conv-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.conv-title { display: flex; flex-direction: column; min-width: 0; }
.conv-title strong { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { font-size: 12px; color: var(--muted); }
.status.on { color: var(--green); }
.back-btn { display: none; }

.messages { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; }
.empty-hint { margin: auto; color: var(--muted); font-size: 14px; }
.day-sep { text-align: center; margin: 14px 0 8px; }
.day-sep span { font-size: 11px; color: var(--muted); padding: 4px 12px; border-radius: 20px; background: var(--glass); }
.msg-row { display: flex; margin: 2px 0; }
.msg-row.mine { justify-content: flex-end; }
.bubble {
  max-width: min(520px, 78%); padding: 9px 13px 6px; border-radius: 18px 18px 18px 6px;
  background: var(--glass-strong); word-break: break-word;
}
.bubble.mine { background: linear-gradient(135deg, var(--blue), var(--blue-2)); border-radius: 18px 18px 6px 18px; }
.bubble p { margin: 0; font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; }
.bubble time { display: block; text-align: right; margin-top: 2px; font-size: 10.5px; color: rgba(255, 255, 255, 0.6); }

.conv-error { margin: 0 18px 8px; padding: 8px 12px; border-radius: 10px; font-size: 13px; background: rgba(225, 29, 72, 0.15); color: #ffc2cd; }
.emoji-panel {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; margin: 0 18px 8px; padding: 8px; border-radius: 14px;
  background: rgba(30, 30, 40, 0.95); border: 1px solid var(--border);
}
.emoji-panel button { font-size: 22px; padding: 4px; border-radius: 8px; }
.emoji-panel button:hover { background: var(--glass-strong); }

.composer { display: flex; align-items: flex-end; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid var(--border); }
.composer textarea {
  flex: 1; min-width: 0; resize: none; max-height: 120px; padding: 11px 16px; border-radius: 22px; font-size: 14.5px;
  background: var(--glass); border: 1px solid var(--border); outline: 0; line-height: 1.4;
}
.composer textarea:focus { border-color: rgba(47, 107, 255, 0.7); }
.send-btn {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: linear-gradient(135deg, var(--blue), var(--blue-2)); color: #fff; transition: opacity 0.15s, transform 0.15s;
}
.send-btn:hover:not(:disabled) { transform: scale(1.06); }
.send-btn:disabled { opacity: 0.4; }

.conv-empty { align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); }
.conv-empty h3 { margin: 14px 0 6px; color: var(--text); font-size: 20px; }
.conv-empty p { margin: 0; max-width: 300px; font-size: 14px; line-height: 1.6; }
.empty-art {
  width: 84px; height: 84px; border-radius: 24px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--blue), #7c3aed); box-shadow: 0 14px 40px rgba(47, 107, 255, 0.35);
}

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100% - 32px);
  padding: 12px 16px; border-radius: 12px; font-size: 13.5px; cursor: pointer; z-index: 20;
  background: rgba(60, 12, 24, 0.95); border: 1px solid rgba(225, 29, 72, 0.6); color: #ffd0d8;
}

/* ---------- mobile ---------- */
@media (max-width: 860px) {
  .chat-page { padding: 0; }
  .shell { grid-template-columns: minmax(0, 1fr); border-radius: 0; border: 0; height: 100dvh; }
  .shell .conv { display: none; }
  .shell.has-active .sidebar { display: none; }
  .shell.has-active .conv { display: flex; }
  .back-btn { display: grid; }
  .sidebar { border-right: 0; padding-top: max(18px, env(safe-area-inset-top)); }
  .composer { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  .conv-head { padding-top: max(14px, env(safe-area-inset-top)); }
}

@media (max-width: 700px) {
  .login-card { grid-template-columns: 1fr; min-height: 0; }
  .login-left { clip-path: none; padding: 30px 28px 24px; }
  .login-right { padding: 26px 28px 32px; }
  .login-left h1 { font-size: 26px; }
}

.emoji-panel button { color: inherit; }
.toast { display: none; z-index: 40; }
[data-theme="light"] { --bg:#eef0f6; --text:#14141a; --muted:#6b6b78; --glass:rgba(0,0,0,.05); --glass-strong:rgba(0,0,0,.09); --border:rgba(0,0,0,.12); }
[data-theme="light"] .login-page { --text:#f4f4f6; --muted:#9a9aa6; }
[data-theme="light"] .chat-page { background:#e6e9f2; }
[data-theme="light"] .shell { background:rgba(255,255,255,.88); }
[data-theme="light"] .conv { background:rgba(255,255,255,.5); }
[data-theme="light"] .emoji-panel, [data-theme="light"] .modal { background:#fff; }
[data-theme="light"] .avatar { background:linear-gradient(135deg,#d5d8e4,#b9bdcf); }
[data-theme="light"] .online-dot { border-color:#fff; }
[data-theme="light"] .bubble time { color:rgba(0,0,0,.45); }
[data-theme="light"] .bubble.mine time { color:rgba(255,255,255,.75); }
.bubble.mine { color:#fff; }
.msg-col { display:flex; flex-direction:column; align-items:flex-start; max-width:min(520px,78%); }
.msg-row.mine .msg-col { align-items:flex-end; }
.msg-col .bubble { max-width:100%; }
.bubble.img-only { padding:4px; }
.bubble img.pic { display:block; max-width:100%; max-height:300px; border-radius:14px; cursor:pointer; }
.bubble.del p { font-style:italic; opacity:.7; }
.quote { margin:0 0 6px; padding:5px 9px; border-left:3px solid var(--red-2); border-radius:8px; background:rgba(0,0,0,.18); font-size:12px; opacity:.9; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.ticks { margin-left:4px; font-size:11px; letter-spacing:-2px; }
.ticks.seen { color:#7dd3fc; }
.reacts { display:flex; flex-wrap:wrap; gap:4px; margin:2px 6px 0; }
.react-chip { font-size:12px; padding:1px 6px; border-radius:12px; background:var(--glass-strong); border:1px solid var(--border); }
.react-chip.me { border-color:var(--blue); }
.actions { display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin:4px 0; padding:5px 8px; border-radius:14px; background:var(--glass-strong); border:1px solid var(--border); }
.actions button { font-size:13px; padding:3px 8px; border-radius:8px; color:var(--text); }
.actions button:hover { background:var(--glass); }
.actions .em { font-size:18px; padding:1px 4px; }
.ctx { display:flex; align-items:center; gap:8px; margin:0 18px 6px; padding:6px 10px; border-radius:10px; background:var(--glass); border-left:3px solid var(--blue); font-size:12.5px; color:var(--muted); }
.ctx span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.me-info { text-align:left; }
.modal-bg { position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:16px; background:rgba(0,0,0,.6); }
.modal { width:min(380px,100%); padding:22px; border-radius:18px; background:#181820; border:1px solid var(--border); }
.modal h3 { margin:0 0 14px; }
.modal label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
.modal input, .modal textarea { width:100%; padding:10px 12px; border-radius:10px; background:var(--glass); border:1px solid var(--border); outline:0; font-size:14px; resize:none; }
.modal .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.modal .btns button { padding:9px 16px; border-radius:10px; background:var(--glass-strong); font-size:14px; }
.modal .btns .primary { background:var(--blue); color:#fff; }

</style>
</head>

  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
};
const EMOJIS = ['😀', '😂', '😍', '🥰', '😎', '🤔', '😢', '😡', '👍', '🙏', '🎉', '❤️', '🔥', '👋', '😅', '🤝'];

const toMs = (ts) => (!ts ? 0 : typeof ts.toMillis === 'function' ? ts.toMillis() : typeof ts.seconds === 'number' ? ts.seconds * 1000 : 0);
const formatTime = (ts) => { const ms = toMs(ts); return ms ? new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : ''; };
const startOfDay = (ms) => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
function formatListTime(ts) {
  const ms = toMs(ts); if (!ms) return '';
  const today = startOfDay(Date.now()); const day = startOfDay(ms);
  if (day === today) return formatTime(ts);
  if (day === today - 86400000) return 'Yesterday';
  return new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' });
}
function dayLabel(ts) {
  const ms = toMs(ts); if (!ms) return '';
  const today = startOfDay(Date.now()); const day = startOfDay(ms);
  if (day === today) return 'Today';
  if (day === today - 86400000) return 'Yesterday';
  return new Date(ms).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}
const isActiveNow = (ts) => { const ms = toMs(ts); return ms > 0 && Date.now() - ms < 3 * 60 * 1000; };
function lastSeenText(ts) {
  const ms = toMs(ts); if (!ms) return 'Offline';
  if (isActiveNow(ts)) return 'Active now';
  const mins = Math.floor((Date.now() - ms) / 60000);
  if (mins < 60) return `Active ${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `Active ${hrs}h ago`;
  return `Last seen ${new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' })}`;
}
const chatIdFor = (a, b) => [a, b].sort().join('_');
const firstName = (n) => String(n || 'User').split(' ')[0];

function avatar(name, src, size, online) {
  const initial = (String(name || '?').trim().charAt(0) || '?').toUpperCase();
  const img = src ? `<img src="${esc(src)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.4)}px"><span>${esc(initial)}</span>${img}${online ? '<i class="online-dot"></i>' : ''}</div>`;
}

/* ---------------- chat data helpers ---------------- */
const usersById = () => { const m = {}; state.users.forEach((u) => { m[u.uid] = u; }); return m; };

function partnerOf(chat, byId) {
  const otherUid = (chat.members || []).find((m) => m !== me.uid) || '';
  const info = (chat.memberInfo && chat.memberInfo[otherUid]) || {};
  const live = byId[otherUid] || {};
  return {
    uid: otherUid,
    name: live.name || info.name || info.email || 'User',
    email: live.email || info.email || '',
    photoURL: live.photoURL || info.photoURL || '',
    lastSeen: live.lastSeen || null,
  };
}

function viewChats() {
  const byId = usersById();
  return state.rawChats
    .filter((c) => c.lastMessage || c.id === state.activeId)
    .map((c) => ({ ...c, partner: partnerOf(c, byId), unreadCount: (c.unread && c.unread[me.uid]) || 0 }))
    .sort((a, b) => toMs(b.updatedAt) - toMs(a.updatedAt));
}

function currentPartner() {
  if (!state.activeId) return null;
  const c = viewChats().find((x) => x.id === state.activeId);
  if (c) return c.partner;
  const u = usersById()[state.activePartnerUid];
  if (u) return { uid: u.uid, name: u.name || 'User', email: u.email || '', photoURL: u.photoURL || '', lastSeen: u.lastSeen || null };
  return null;
}

const QUICK = ['❤️', '😂', '👍', '😮', '😢', '🙏'];
function renderMessages() {
  const box = $('#msgs');
  if (!box) return;
  const p = currentPartner();
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  if (!state.messages.length) {
    box.innerHTML = `<div class="empty-hint">Say hi to ${esc(firstName(p ? p.name : ''))} 👋</div>`;
    return;
  }
  const chat = state.rawChats.find((x) => x.id === state.activeId);
  const seenMs = toMs(chat && chat.lastRead && p ? chat.lastRead[p.uid] : null);
  let last = '';
  let html = '';
  state.messages.forEach((m) => {
    const label = dayLabel(m.createdAt);
    if (label && label !== last) { html += `<div class="day-sep"><span>${esc(label)}</span></div>`; last = label; }
    const mine = m.senderId === me.uid;
    const del = !!m.deleted;
    const t = toMs(m.createdAt);
    let inner = '';
    if (del) inner = '<p>🚫 Message deleted</p>';
    else {
      if (m.replyTo) inner += `<div class="quote">${esc(m.replyTo.text || '📷 Photo')}</div>`;
      if (m.imageUrl) inner += `<img class="pic" src="${esc(m.imageUrl)}" alt="photo">`;
      if (m.text) inner += `<p>${esc(m.text)}</p>`;
    }
    const seen = seenMs > 0 && t > 0 && seenMs >= t;
    const tick = mine && !del ? `<span class="ticks${seen ? ' seen' : ''}">${!t ? '🕓' : seen ? '✓✓' : '✓'}</span>` : '';
    const edited = m.edited && !del ? ' · edited' : '';
    const imgOnly = !del && m.imageUrl && !m.text && !m.replyTo;
    html += `<div class="${mine ? 'msg-row mine' : 'msg-row'}"><div class="msg-col"><div class="${(mine ? 'bubble mine' : 'bubble') + (del ? ' del' : '') + (imgOnly ? ' img-only' : '')}" data-msg="${esc(m.id)}">${inner}<time>${esc(formatTime(m.createdAt))}${edited}${tick}</time></div>`;
    const rc = {};
    Object.entries(m.reactions || {}).forEach(([u, e]) => { rc[e] = rc[e] || { n: 0, me: false }; rc[e].n++; if (u === me.uid) rc[e].me = true; });
    if (!del && Object.keys(rc).length) html += `<div class="reacts">${Object.entries(rc).map(([e, v]) => `<span class="react-chip${v.me ? ' me' : ''}">${esc(e)}${v.n > 1 ? ' ' + v.n : ''}</span>`).join('')}</div>`;
    if (state.selId === m.id && !del) html += actionsHtml(m, mine);
    html += '</div></div>';
  });
  box.innerHTML = html;
  if (stick) box.scrollTop = box.scrollHeight;
}

function actionsHtml(m, mine) {
  const cur = (m.reactions || {})[me.uid];
  return `<div class="actions">${QUICK.map((e) => `<button type="button" class="em" data-react="${e}"${cur === e ? ' style="background:var(--glass)"' : ''}>${e}</button>`).join('')}<button type="button" data-act="reply">↩ Reply</button>${m.text ? '<button type="button" data-act="copy">Copy</button>' : ''}${mine && m.text ? '<button type="button" data-act="edit">Edit</button>' : ''}${mine ? '<button type="button" data-act="delete">Delete</button>' : ''}</div>`;
}

function onMsgClick(e) {
  const img = e.target.closest('img.pic');
  if (img) {
    const bg = document.createElement('div');
    bg.className = 'modal-bg'; bg.style.cursor = 'zoom-out';
    const big = document.createElement('img');
    big.src = img.src; big.style.cssText = 'max-width:100%;max-height:100%;border-radius:12px';
    bg.appendChild(big);
    bg.addEventListener('click', () => bg.remove());
    document.body.appendChild(bg);
    return;
  }
  if (e.target.closest('.actions')) {
    const m = state.messages.find((x) => x.id === state.selId);
    if (!m) return;
    const r = e.target.closest('[data-react]');
    if (r) { reactTo(m, r.dataset.react); return; }
    const a = e.target.closest('[data-act]');
    if (!a) return;
    const k = a.dataset.act;
    const inp = $('#input');
    if (k === 'reply') {
      state.replyTo = { id: m.id, text: (m.text || '📷 Photo').slice(0, 120), senderId: m.senderId };
      state.editingId = null; state.selId = null; renderCtx(); renderMessages(); inp.focus();
    } else if (k === 'copy') {
      if (navigator.clipboard) navigator.clipboard.writeText(m.text).then(() => toast('Copied ✓'), () => toast('Copy kora jayni.'));
      state.selId = null; renderMessages();
    } else if (k === 'edit') {
      state.editingId = m.id; state.replyTo = null; state.selId = null;
      inp.value = m.text; $('#sendBtn').disabled = false; renderCtx(); renderMessages(); inp.focus();
    } else if (k === 'delete') deleteMsg(m);
    return;
  }
  if (e.target.closest('.reacts')) return;
  const b = e.target.closest('[data-msg]');
  state.selId = b && state.selId !== b.dataset.msg ? b.dataset.msg : null;
  renderMessages();
}

function renderCtx() {
  const el = $('#ctx');
  if (!el) return;
  const x = '<button type="button" class="icon-btn" data-cancel aria-label="Cancel">✕</button>';
  if (state.editingId) { el.style.display = 'flex'; el.innerHTML = `<span>✏️ Editing message</span>${x}`; }
  else if (state.replyTo) {
    const p = currentPartner();
    const who = state.replyTo.senderId === me.uid ? 'yourself' : firstName(p ? p.name : '');
    el.style.display = 'flex'; el.innerHTML = `<span>↩ Replying to ${esc(who)}: ${esc(state.replyTo.text)}</span>${x}`;
  } else { el.style.display = 'none'; el.innerHTML = ''; }
}
function clearCtx() {
  if (state.editingId) { const i = $('#input'); if (i) i.value = ''; const b = $('#sendBtn'); if (b) b.disabled = true; }
  state.editingId = null; state.replyTo = null; renderCtx();
}

async function reactTo(m, emoji) {
  const chatId = state.activeId;
  const cur = (m.reactions || {})[me.uid];
  state.selId = null; renderMessages();
  try { await updateDoc(doc(db, 'chats', chatId, 'messages', m.id), { [`reactions.${me.uid}`]: cur === emoji ? deleteField() : emoji }); }
  catch (e) { console.error(e); toast('React dite parini. Firestore rules update korun.'); }
}

async function deleteMsg(m) {
  if (!confirm('Ei message ta delete korben?')) return;
  const chatId = state.activeId;
  const isLast = state.messages.length && state.messages[state.messages.length - 1].id === m.id;
  state.selId = null; renderMessages();
  try {
    await updateDoc(doc(db, 'chats', chatId, 'messages', m.id), { deleted: true, text: '', imageUrl: deleteField(), replyTo: deleteField(), reactions: deleteField() });
    if (isLast) updateDoc(doc(db, 'chats', chatId), { lastMessage: { text: '🚫 Message deleted', senderId: me.uid } }).catch(() => {});
  } catch (e) { console.error(e); toast('Delete kora jayni. Firestore rules update korun.'); }
}

function sendTyping() {
  const now = Date.now();
  if (!state.activeId || now - lastTypingSent < 2500) return;
  lastTypingSent = now;
  updateDoc(doc(db, 'chats', state.activeId), { [`typing.${me.uid}`]: serverTimestamp() }).catch(() => {});
}
function partnerTyping(p) {
  const c = state.rawChats.find((x) => x.id === state.activeId);
  const ms = toMs(c && c.typing ? c.typing[p.uid] : null);
  return ms > 0 && Date.now() - ms < 4500;
}

function renderMe() {
  const p = usersById()[me.uid];
  const n = $('#meName'), b = $('#meBio');
  if (!p || !n || !b) return;
  n.textContent = p.name || me.displayName || me.email || 'User';
  b.textContent = p.bio || me.email || '';
}
function openProfile() {
  const p = usersById()[me.uid] || {};
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><h3>Edit profile</h3><label>Name</label><input id="pfName" maxlength="40" value="${esc(p.name || me.displayName || '')}"><label>Bio</label><textarea id="pfBio" rows="3" maxlength="120">${esc(p.bio || '')}</textarea><div class="btns"><button type="button" id="pfCancel">Cancel</button><button type="button" class="primary" id="pfSave">Save</button></div></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener('click', (e) => { if (e.target === bg) close(); });
  bg.querySelector('#pfCancel').addEventListener('click', close);
  bg.querySelector('#pfSave').addEventListener('click', async () => {
    const name = bg.querySelector('#pfName').value.trim().slice(0, 40);
    const bio = bg.querySelector('#pfBio').value.trim().slice(0, 120);
    if (!name) { toast('Name khali rakha jabe na.'); return; }
    try { await updateDoc(doc(db, 'users', me.uid), { name, bio }); close(); }
    catch (e) { console.error(e); toast('Profile save hoyni. Abar try korun.'); }
  });
}

function unlockAlerts() {
  try { const A = window.AudioContext || window.webkitAudioContext; if (A && !audioCtx) audioCtx = new A(); } catch (e) {}
  try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
}
function beep() {
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    audioCtx = audioCtx || new A();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(t + 0.25);
  } catch (e) {}
}
function notify(c) {
  beep();
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      const p = partnerOf(c, usersById());
      const n = new Notification(p.name, { body: c.lastMessage.text, tag: c.id });
      n.onclick = () => { window.focus(); openChat(c.id); n.close(); };
    }
  } catch (e) {}
}
function onChatsUpdate() {
  const cur = {};
  state.rawChats.forEach((c) => { cur[c.id] = (c.unread && c.unread[me.uid]) || 0; });
  if (state.unreadPrev) {
    state.rawChats.forEach((c) => {
      if (cur[c.id] > (state.unreadPrev[c.id] || 0) && c.lastMessage && c.lastMessage.senderId !== me.uid && (document.visibilityState !== 'visible' || c.id !== state.activeId)) notify(c);
    });
  }
  state.unreadPrev = cur;
  const ac = state.rawChats.find((x) => x.id === state.activeId);
  const p = currentPartner();
  const sig = ac && ac.lastRead && p ? toMs(ac.lastRead[p.uid]) : 0;
  if (sig !== state.seenSig) { state.seenSig = sig; renderMessages(); }
}

/* ---------------- actions ---------------- */
function subscribeMessages(chatId) {
  if (unsubMsgs) unsubMsgs();
  state.messages = [];
  const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('createdAt'), limitToLast(200));
  unsubMsgs = onSnapshot(q, (snap) => {
    if (state.activeId !== chatId) return;
    state.messages = snap.docs.map((d) => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
    renderMessages();
  }, (err) => {
    console.error(err);
    const el = $('#convErr');
    if (el) { el.textContent = 'Messages load korte problem hoyeche. Firestore rules ar internet check korun.'; el.style.display = 'block'; }
  });
}

function setActive(chatId, partnerUid) {
  state.editingId = null; state.replyTo = null; state.selId = null; state.seenSig = null; lastTypingSent = 0;
  state.activeId = chatId;
  state.activePartnerUid = partnerUid;
  renderConv();
  renderSidebar();
  subscribeMessages(chatId);
  markRead();
  const input = $('#input');
  if (input && window.matchMedia('(min-width: 861px)').matches) input.focus();
}

function closeChat() {
  state.editingId = null; state.replyTo = null; state.selId = null;
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  state.activeId = null;
  state.activePartnerUid = null;
  state.messages = [];
  renderConv();
  renderSidebar();
}

function openChat(chatId) {
  const c = viewChats().find((x) => x.id === chatId);
  if (c) setActive(chatId, c.partner.uid);
}

async function openUser(uid) {
  const u = usersById()[uid];
  if (!u) return;
  const id = chatIdFor(me.uid, uid);
  try {
    const ref = doc(db, 'chats', id);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, {
        members: [me.uid, uid].sort(),
        memberInfo: {
          [me.uid]: { name: me.displayName || me.email || 'User', email: me.email || '', photoURL: me.photoURL || '' },
          [uid]: { name: u.name || u.email || 'User', email: u.email || '', photoURL: u.photoURL || '' },
        },
        lastMessage: null,
        unread: { [me.uid]: 0, [uid]: 0 },
        updatedAt: serverTimestamp(),
      });
    }
    state.tab = 'chats';
    state.search = '';
    const s = $('#search'); if (s) s.value = '';
    setActive(id, uid);
  } catch (e) {
    console.error(e);
    toast('Chat shuru kora jayni. Abar try korun.');
  }
}

async function sendMessage() {
  const input = $('#input');
  const p = currentPartner();
  if (!input || !p || state.sending) return;
  const value = input.value.trim();
  if (!value) return;
  const chatId = state.activeId;
  state.sending = true;
  $('#sendBtn').disabled = true;
  try {
    if (state.editingId) {
      const mid = state.editingId;
      const isLast = state.messages.length && state.messages[state.messages.length - 1].id === mid;
      await updateDoc(doc(db, 'chats', chatId, 'messages', mid), { text: value.slice(0, 2000), edited: true });
      if (isLast) updateDoc(doc(db, 'chats', chatId), { lastMessage: { text: value.slice(0, 200), senderId: me.uid } }).catch(() => {});
      state.editingId = null;
    } else {
      const batch = writeBatch(db);
      const msgRef = doc(collection(db, 'chats', chatId, 'messages'));
      const data = { text: value.slice(0, 2000), senderId: me.uid, createdAt: serverTimestamp() };
      if (state.replyTo) data.replyTo = { id: state.replyTo.id, text: state.replyTo.text, senderId: state.replyTo.senderId };
      batch.set(msgRef, data);
      batch.update(doc(db, 'chats', chatId), {
        lastMessage: { text: value.slice(0, 200), senderId: me.uid },
        updatedAt: serverTimestamp(),
        [`unread.${p.uid}`]: increment(1),
      });
      await batch.commit();
      state.replyTo = null;
      lastTypingSent = 0;
      updateDoc(doc(db, 'chats', chatId), { [`typing.${me.uid}`]: 0 }).catch(() => {});
    }
    input.value = '';
    renderCtx();
    const panel = $('#emoji'); if (panel) panel.style.display = 'none';
    const err = $('#convErr'); if (err) err.style.display = 'none';
    input.focus();
  } catch (e) {
    console.error(e);
    const err = $('#convErr');
    if (err) { err.textContent = state.editingId ? 'Edit save hoyni. Firestore rules update korun.' : 'Message pathano jayni. Abar try korun.'; err.style.display = 'block'; }
  } finally {
    state.sending = false;
    const b = $('#sendBtn'); const i = $('#input');
    if (b && i) b.disabled = !i.value.trim();
  }
}

function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, 900 / Math.max(im.naturalWidth, im.naturalHeight));
      const w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const cx = cv.getContext('2d');
      cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);
      let q = 0.72, out = cv.toDataURL('image/jpeg', q);
      while (out.length > 600000 && q > 0.3) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
      if (out.length > 800000) reject(new Error('too big')); else resolve(out);
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    im.src = url;
  });
}

async function sendImage(file) {
  const p = currentPartner();
  const chatId = state.activeId;
  if (!p || !chatId || state.sending) return;
  if (state.editingId) clearCtx();
  if (!/^image\//.test(file.type)) { toast('Shudhu chobi pathano jabe.'); return; }
  if (file.size > 10 * 1024 * 1024) { toast('Chobi 10MB er choto hote hobe.'); return; }
  state.sending = true;
  toast('Photo pathano hocche...');
  try {
    const url = await shrinkImage(file);
    const batch = writeBatch(db);
    const msgRef = doc(collection(db, 'chats', chatId, 'messages'));
    const data = { text: '', imageUrl: url, senderId: me.uid, createdAt: serverTimestamp() };
    if (state.replyTo) data.replyTo = { id: state.replyTo.id, text: state.replyTo.text, senderId: state.replyTo.senderId };
    batch.set(msgRef, data);
    batch.update(doc(db, 'chats', chatId), { lastMessage: { text: '📷 Photo', senderId: me.uid }, updatedAt: serverTimestamp(), [`unread.${p.uid}`]: increment(1) });
    await batch.commit();
    state.replyTo = null; renderCtx();
    const t = $('#toast'); if (t) t.style.display = 'none';
  } catch (e) {
    console.error(e);
    toast('Photo pathano jayni. Onno ekta chobi diye try korun.');
  } finally {
    state.sending = false;
    const b = $('#sendBtn'); const i = $('#input');
    if (b && i) b.disabled = !i.value.trim();
  }
}

function markRead() {
  if (!state.activeId || state.reading || document.visibilityState !== 'visible') return;
  const c = state.rawChats.find((x) => x.id === state.activeId);
  const n = (c && c.unread && c.unread[me.uid]) || 0;
  if (n > 0) {
    state.reading = true;
    const ref = doc(db, 'chats', state.activeId);
    updateDoc(ref, { [`unread.${me.uid}`]: 0 })
      .catch(() => {})
      .finally(() => { state.reading = false; });
    updateDoc(ref, { [`lastRead.${me.uid}`]: serverTimestamp() }).catch(() => {});
  }
}

function startListeners() {
  unsubUsers = onSnapshot(query(collection(db, 'users'), limit(300)), (snap) => {
    state.users = snap.docs.map((d) => ({ ...d.data({ serverTimestamps: 'estimate' }), uid: d.id }));
    renderSidebar();
    renderConvHeader();
  }, (err) => { console.error(err); toast('Users load hoyni. Firestore rules publish korechen kina check korun.'); });

  unsubChats = onSnapshot(query(collection(db, 'chats'), where('members', 'array-contains', me.uid)), (snap) => {
    state.rawChats = snap.docs.map((d) => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
    renderSidebar();
    renderConvHeader();
    markRead();
    onChatsUpdate();
  }, (err) => { console.error(err); toast('Chats load hoyni. Firestore rules ar internet check korun.'); });

  const beat = () => {
    if (document.visibilityState === 'visible' && me) {
      updateDoc(doc(db, 'users', me.uid), { lastSeen: serverTimestamp() }).catch(() => {});
    }
  };
  heartbeat = setInterval(beat, 60000);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && me) {
    markRead();
    updateDoc(doc(db, 'users', me.uid), { lastSeen: serverTimestamp() }).catch(() => {});
  }
});

/* ---------------- boot ---------------- */
onAuthStateChanged(auth, async (u) => {
  stopAll();
  me = u;
  if (!u) { showLogin(); return; }
  showChat();
  try {
    const uref = doc(db, 'users', u.uid);
    const snap = await getDoc(uref);
    const base = { uid: u.uid, email: u.email || '', photoURL: u.photoURL || '', lastSeen: serverTimestamp() };
    if (!snap.exists() || !snap.data().name) base.name = u.displayName || (u.email ? u.email.split('@')[0] : 'User');
    await setDoc(uref, base, { merge: true });
  } catch (e) {
    console.error('Profile save failed:', e);
    toast('Profile save hoyni. Firestore rules publish korechen kina check korun.');
  }
});

</script>
