const V4 = { ghost: false, autoReply: { on: false, text: '' }, reminders: [], reminderTimer: null, viewOnceSeen: new Set(), repliedKeys: {}, appLockUnlocked: false };
try { V4.ghost = localStorage.getItem('mu-v4-ghost') === 'on'; } catch (e) {}
try { const ar = JSON.parse(localStorage.getItem('mu-v4-autoreply') || '{}'); if (ar && typeof ar === 'object') { V4.autoReply.on = !!ar.on; V4.autoReply.text = typeof ar.text === 'string' ? ar.text : ''; } } catch (e) {}
try { const rm = JSON.parse(localStorage.getItem('mu-v4-reminders') || '[]'); if (Array.isArray(rm)) V4.reminders = rm; } catch (e) {}
try { const vo = JSON.parse(localStorage.getItem('mu-v4-viewonce-seen') || '[]'); if (Array.isArray(vo)) V4.viewOnceSeen = new Set(vo); } catch (e) {}
function v4saveGhost() { try { localStorage.setItem('mu-v4-ghost', V4.ghost ? 'on' : 'off'); } catch (e) {} }
function v4saveAutoReply() { try { localStorage.setItem('mu-v4-autoreply', JSON.stringify(V4.autoReply)); } catch (e) {} }
function v4saveReminders() { try { localStorage.setItem('mu-v4-reminders', JSON.stringify(V4.reminders)); } catch (e) {} }
function v4saveViewOnceSeen() { try { localStorage.setItem('mu-v4-viewonce-seen', JSON.stringify([...V4.viewOnceSeen])); } catch (e) {} }

/* ---------- V4 dot menus (one open at a time, slide panel) ---------- */
function v4CloseMenus() {
  try {
    ['#topDotMenu', '#chatDotMenu'].forEach((sel) => { const el = document.querySelector(sel); if (el) { el.classList.remove('open'); el.style.display = 'none'; } });
    const bd = $('#dotBackdrop'); if (bd) bd.style.display = 'none';
  } catch (e) {}
}
function v4ShowDotMenu(el, html, anchor) {
  try {
    v4CloseMenus();
    if (!el) return;
    el.innerHTML = html;
    el.classList.add('open');
    el.style.display = 'block';
    try {
      const r = anchor ? anchor.getBoundingClientRect() : null;
      if (r) { el.style.top = (r.bottom + 6) + 'px'; el.style.left = 'auto'; el.style.right = Math.max(8, window.innerWidth - r.right) + 'px'; }
    } catch (e) {}
    const bd = $('#dotBackdrop');
    if (bd) { bd.style.display = 'block'; bd.onclick = () => { try { v4CloseMenus(); } catch (e) {} }; }
  } catch (e) {}
}
document.addEventListener('keydown', (e) => { try { if (e.key === 'Escape') v4CloseMenus(); } catch (er) {} });

        const k = b.dataset.chat;
        v4CloseMenus();
        if (k === 'view') { if (p.isGroup) openGroupInfo(); else openProfilePage(p.uid); }
        else if (k === 'disappear') openV3Disappearing();
        else if (k === 'wallpaper') openV3Wallpaper();
        else if (k === 'mute') { const on = v3ToggleList('muted', chatId); toast(on ? 'Chat muted 🔕' : 'Chat unmuted 🔔'); }
        else if (k === 'archive') { const on = v3ToggleList('archived', chatId); toast(on ? 'Chat archived 🗄️' : 'Chat unarchived 📥'); renderSidebar(); if (on) closeChat(); }
        else if (k === 'block') { const on = v3ToggleList('blocked', p.uid); toast(on ? 'User blocked 🚫' : 'User unblocked ✅'); renderSidebar(); renderMessages(); }
        else if (k === 'report') { try { await reportItem('user', p.uid); } catch (er) { toast('Report pathano jayni.'); } }
        else if (k === 'export') v3ExportChat();
        else if (k === 'clear') v4ClearChat();
        else if (k === 'search') openMsgSearch();
      } catch (er) { toast('Kaj ta hoyni. Abar try korun.'); }
    };
  } catch (e) { toast('Menu khola jayni.'); }
}

/* ---------- V4 GhostMode: hide my online / last-seen / typing ---------- */
function v4GhostModeOn() { try { return !!V4.ghost; } catch (e) { return false; } }
async function v4ToggleGhostMode() {
  try {
    V4.ghost = !V4.ghost;
    v4saveGhost();
    try { if (me) await updateDoc(doc(db, 'users', me.uid), { ghostMode: V4.ghost }); } catch (e) {}
    toast(V4.ghost ? '👻 Ghost Mode ON — online / last-seen / typing lukano thakbe.' : '👻 Ghost Mode OFF — abar normal.');
  } catch (e) { toast('Ghost Mode bodlano jayni.'); }
}

/* ---------- V4 ViewOnce photo: viewed once, then auto-deletes ---------- */
function v4ViewOnceHtml(m) {
  try {
    if (m.senderId === me.uid) return '<div class="preview">👁 View-once photo · sent' + (m.viewOnceOpened ? ' · opened ✓' : '') + '</div>';
    if (V4.viewOnceSeen.has(m.id)) return '<div class="preview">👁 View-once photo — already viewed, deleted</div>';
    return '<button type="button" class="pill primary" data-viewonce="' + esc(m.id) + '">👁 Tap to view once</button>';
  } catch (e) { return '<div class="preview">👁 View-once photo</div>'; }
}
async function v4SendViewOnce() {
  try {
    const chatId = state.activeId; const p = currentPartner();
    if (!chatId || !p) { toast('Age ekta chat khulun.'); return; }
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.addEventListener('change', async () => {
      try {
        const f = inp.files && inp.files[0];
        if (!f) return;
        if (!/^image\//.test(f.type)) { toast('Shudhu chobi pathano jabe.'); return; }
        if (f.size > 10 * 1024 * 1024) { toast('Chobi 10MB er choto hote hobe.'); return; }
        toast('View-once photo pathano hocche...');
        const url = await shrinkImage(f);
        const batch = writeBatch(db);
        const msgRef = doc(collection(db, 'chats', chatId, 'messages'));
        batch.set(msgRef, { text: '', imageUrl: url, viewOnce: true, senderId: me.uid, createdAt: serverTimestamp() });
        batch.update(doc(db, 'chats', chatId), { lastMessage: { text: '👁 View-once photo', senderId: me.uid }, updatedAt: serverTimestamp(), ...unreadInc(p, chatId) });
        await batch.commit();
        toast('👁 View-once photo pathano hoyeche ✓');
      } catch (e) { toast('View-once photo pathano jayni.'); }
    });
    inp.click();
  } catch (e) { toast('View-once khola jayni.'); }
}
function v4OpenViewOnce(msgId) {
  try {
    const m = (state.messages || []).find((x) => x.id === msgId);
    if (!m || !m.imageUrl) { toast('Photo ta pawa jayni.'); return; }
    if (V4.viewOnceSeen.has(msgId)) { toast('Ei photo ager theke dekha hoye geche — deleted.'); return; }
    const bg = document.createElement('div');
    bg.className = 'modal-bg'; bg.style.cursor = 'zoom-out';
    const big = document.createElement('img');
    big.src = m.imageUrl; big.alt = 'View-once photo'; big.style.cssText = 'max-width:100%;max-height:100%;border-radius:12px';
    bg.appendChild(big);
    document.body.appendChild(bg);
    V4.viewOnceSeen.add(msgId); v4saveViewOnceSeen();
    const close = () => { try { bg.remove(); } catch (e) {} try { renderMessages(); } catch (e) {} };
    bg.addEventListener('click', async () => {
      close();
      try { await deleteDoc(doc(db, 'chats', state.activeId, 'messages', msgId)); } catch (e) {}
      try { await updateDoc(doc(db, 'chats', state.activeId), { lastMessage: { text: '👁 View-once photo (viewed)', senderId: m.senderId } }); } catch (e) {}
      toast('👁 View-once photo deleted.');
    });
  } catch (e) { toast('Photo khola jayni.'); }
}

/* ---------- V4 AppLock: whole-app PIN lock (hash in localStorage only) ---------- */
function v4NeedsAppLock() { try { return !!localStorage.getItem('mu-v4-applock') && !V4.appLockUnlocked; } catch (e) { return false; } }
function v4ShowAppLock(onOk) {
  try {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px';
    ov.innerHTML = '<div class="modal" style="text-align:center"><div style="font-size:40px">🔒</div><h3>App Lock</h3><p style="color:var(--muted);font-size:13px">App khulte PIN din. PIN shudhu ei phone e thake.</p><input id="v4LockPin" type="text" inputmode="numeric" maxlength="8" placeholder="PIN" style="text-align:center"><div class="btns" style="justify-content:center"><button type="button" class="primary" id="v4LockGo">Unlock</button></div><p class="preview">PIN bhule gele browser data clear korte hobe.</p></div>';
    document.body.appendChild(ov);
    const go = async () => {
      try {
        const pin = (ov.querySelector('#v4LockPin').value || '').trim();
        if (!/^\d{4,8}$/.test(pin)) { toast('4–8 digit PIN din.'); return; }
        const h = await sha256Hex(pin);
        if (h === localStorage.getItem('mu-v4-applock')) { V4.appLockUnlocked = true; ov.remove(); try { onOk(); } catch (e) {} }
        else toast('PIN vul.');
      } catch (e) { toast('Unlock hoyni.'); }
    };
    ov.querySelector('#v4LockGo').addEventListener('click', go);
    ov.querySelector('#v4LockPin').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    try { ov.querySelector('#v4LockPin').focus(); } catch (e) {}
  } catch (e) { try { onOk(); } catch (er) {} }
}
function v4AppLockSheet() {
  try {
    const has = !!localStorage.getItem('mu-v4-applock');
    const bg = v3OpenSheet('🔒 App Lock', '<p class="preview">PIN shudhu ei phone er localStorage e hash hoye thake — kokhono server e jay na.</p><label>4–8 digit PIN</label><input id="v4AppPin" type="text" inputmode="numeric" maxlength="8" placeholder="PIN"><div class="btns"><button type="button" class="primary" id="v4AppSet">' + (has ? 'Change PIN' : 'Set App Lock') + '</button>' + (has ? '<button type="button" id="v4AppRemove">Remove lock</button>' : '') + '</div>');
    if (!bg) return;
    bg.querySelector('#v4AppSet').addEventListener('click', async () => {
      const btn = bg.querySelector('#v4AppSet'); v3Busy(btn, true, 'Saving...');
      try {
        const pin = (bg.querySelector('#v4AppPin').value || '').trim();
        if (!/^\d{4,8}$/.test(pin)) { toast('4–8 digit PIN din.'); return; }
        try { localStorage.setItem('mu-v4-applock', await sha256Hex(pin)); } catch (e) {}
        V4.appLockUnlocked = true;
        toast('🔒 App Lock set hoyeche ✓'); bg.remove();
      } catch (e) { toast('App Lock set hoyni.'); }
      finally { v3Busy(btn, false, has ? 'Change PIN' : 'Set App Lock'); }
    });
    const rm = bg.querySelector('#v4AppRemove');
    if (rm) rm.addEventListener('click', async () => {
      try {
        const pin = (bg.querySelector('#v4AppPin').value || '').trim();
        const h = await sha256Hex(pin);
        if (h !== localStorage.getItem('mu-v4-applock')) { toast('PIN vul.'); return; }
        localStorage.removeItem('mu-v4-applock'); V4.appLockUnlocked = true;
        toast('🔓 App Lock remove hoyeche.'); bg.remove();
      } catch (e) { toast('Remove hoyni.'); }
    });
  } catch (e) { toast('App Lock khola jayni.'); }
}

/* ---------- V4 Backup: export ALL my chats as one .json ---------- */
async function v4FullBackup() {
  try {
    toast('Full backup hocche… ektu wait korun.');
    const out = { app: 'Message Up V4', exportedAt: new Date().toISOString(), user: me ? (me.email || '') : '', chats: [] };
    for (const c of (state.rawChats || [])) {
      try {
        const snap = await getDocs(query(collection(db, 'chats', c.id, 'messages'), orderBy('createdAt'), limitToLast(500)));
        const msgs = snap.docs.map((d) => { try { const x = d.data() || {}; return { id: d.id, senderId: x.senderId || '', text: x.text || '', hasImage: !!x.imageUrl, hasAudio: !!x.audioUrl, createdAt: toMs(x.createdAt) }; } catch (e) { return { id: d.id }; } });
        out.chats.push({ id: c.id, name: partnerOf(c, usersById()).name, messages: msgs });
      } catch (e) { out.chats.push({ id: c.id, error: 'could not read' }); }
    }
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'message-up-v4-full-backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => { try { URL.revokeObjectURL(a.href); } catch (e) {} }, 5000);
    toast('Full backup download hoyeche ✓');
  } catch (e) { toast('Backup hoyni. Abar try korun.'); }
}

/* ---------- V4 ThemeStudio: WhatsApp green / Midnight / Rose / Ocean ---------- */

  try {
    const n = ['whatsapp', 'midnight', 'rose', 'ocean'].includes(name) ? name : 'whatsapp';

    else document.documentElement.dataset.v4theme = n;

}
function v4ApplyThemeStudio() {

}
function v4ThemeStudioSheet() {
  try {
    const cur = document.documentElement.dataset.v4theme || 'whatsapp';
    const opts = [['whatsapp', '💚 WhatsApp Green'], ['midnight', '🌌 Midnight'], ['rose', '🌹 Rose'], ['ocean', '🌊 Ocean']];

try { v4ApplyThemeStudio(); } catch (e) {}

/* ---------- V4 AutoReply: vacation responder (client-side, while app open) ---------- */
function v4AutoReplySheet() {
  try {
    const cur = V4.autoReply || { on: false, text: '' };
    const bg = v3OpenSheet('🤖 Auto-Reply', '<p class="preview">ON thakle app khola thaka obosthay notun incoming message e auto-reply jabe. Reply te [AUTO] label thakbe.</p><div class="set-row"><span>Auto-Reply</span><button type="button" class="pill" id="v4ArToggle">' + (cur.on ? 'ON' : 'OFF') + '</button></div><label>Reply text</label><textarea id="v4ArText" rows="3" maxlength="500" placeholder="Ami ekhon busy, pore reply dibo...">' + esc(cur.text || '') + '</textarea><div class="btns"><button type="button" class="primary" id="v4ArSave">Save</button></div>');
    if (!bg) return;
    bg.querySelector('#v4ArToggle').addEventListener('click', () => {
      try { V4.autoReply.on = !V4.autoReply.on; bg.querySelector('#v4ArToggle').textContent = V4.autoReply.on ? 'ON' : 'OFF'; } catch (e) {}
    });
    bg.querySelector('#v4ArSave').addEventListener('click', () => {
      try {
        V4.autoReply.text = (bg.querySelector('#v4ArText').value || '').trim().slice(0, 500);
        v4saveAutoReply();
        toast('Auto-Reply saved ✓'); bg.remove();
      } catch (e) { toast('Save hoyni.'); }
    });
  } catch (e) { toast('Auto-Reply khola jayni.'); }
}
async function v4MaybeAutoReply(c) {
  try {
    if (!V4.autoReply || !V4.autoReply.on) return;
    if (!me || !c || !c.lastMessage) return;
    if (c.lastMessage.senderId === me.uid) return;
    if (document.visibilityState !== 'visible') return;
    const key = c.id + '|' + String(c.lastMessage.text || '');
    if (V4.repliedKeys[key]) return;
    V4.repliedKeys[key] = 1;
    const text = (V4.autoReply.text || '').trim() || 'Ami ekhon busy, pore reply dibo.';
    const batch = writeBatch(db);
    const msgRef = doc(collection(db, 'chats', c.id, 'messages'));
    batch.set(msgRef, { text: text + '\n[AUTO — Auto-Reply]', senderId: me.uid, createdAt: serverTimestamp(), autoReply: true });
    batch.update(doc(db, 'chats', c.id), { lastMessage: { text: (text + ' [AUTO]').slice(0, 200), senderId: me.uid }, updatedAt: serverTimestamp() });
    await batch.commit();
  } catch (e) {}
}

/* ---------- V4 Reminder: long-press a message → remind me later ---------- */
function v4ReminderSheet(m) {
  try {
    if (!m) return;
    const bg = v3OpenSheet('⏰ Message Reminder', '<p class="preview">' + esc((m.text || '📷 Photo').slice(0, 120)) + '</p>'
      + '<button type="button" class="pill" data-rem="1800000" style="display:block;width:100%;margin:5px 0;text-align:left">⏰ Remind me in 30 min</button>'
      + '<button type="button" class="pill" data-rem="3600000" style="display:block;width:100%;margin:5px 0;text-align:left">⏰ Remind me in 1 hour</button>'
      + '<button type="button" class="pill" data-rem="86400000" style="display:block;width:100%;margin:5px 0;text-align:left">⏰ Remind me tomorrow</button>');
    if (!bg) return;
    bg.addEventListener('click', (e) => {
      try {
        const b = e.target.closest('[data-rem]');
        if (!b) return;
        const ms = parseInt(b.dataset.rem, 10) || 3600000;
        V4.reminders.push({ id: 'rem_' + Date.now(), chatId: state.activeId, msgId: m.id, text: (m.text || '📷 Photo').slice(0, 120), at: Date.now() + ms });
        v4saveReminders();
        toast('⏰ Reminder set — somoy hole toast asbe.'); bg.remove();
      } catch (er) { toast('Reminder set hoyni.'); }
    });
  } catch (e) { toast('Reminder khola jayni.'); }
}
function v4StartReminders() {
  try {
    if (V4.reminderTimer) return;
    const check = () => {
      try {
        const now = Date.now();
        const due = V4.reminders.filter((r) => r.at <= now);
        if (!due.length) return;
        V4.reminders = V4.reminders.filter((r) => r.at > now);
        v4saveReminders();
        due.forEach((r) => { try { toast('⏰ Reminder: ' + (r.text || 'Message')); } catch (e) {} });
      } catch (e) {}
    };
    check();
    V4.reminderTimer = setInterval(check, 30000);
  } catch (e) {}
}
function v4RemindersSheet() {
  try {
    const list = V4.reminders || [];
    const bg = v3OpenSheet('⏰ My Reminders', list.length ? list.map((r) => '<div class="prow" style="cursor:default"><div class="pn">' + esc(r.text || '') + '<div class="preview">' + new Date(r.at).toLocaleString() + '</div></div><button type="button" class="pill" data-remdel="' + esc(r.id) + '">Delete</button></div>').join('') : '<div class="list-empty">Kono reminder nai. Message long-press / ⏰ Remind diye set korun.</div>');
    if (!bg) return;
    bg.addEventListener('click', (e) => {
      try {
        const b = e.target.closest('[data-remdel]');
        if (!b) return;
        V4.reminders = V4.reminders.filter((r) => r.id !== b.dataset.remdel);
        v4saveReminders();
        toast('Reminder deleted.'); bg.remove(); v4RemindersSheet();
      } catch (er) { toast('Delete hoyni.'); }
    });
  } catch (e) { toast('Reminders khola jayni.'); }
}

/* ---------- V4 StarredManager: all starred messages across chats ---------- */
function openStarredManager() {
  try { openStarredPage(); } catch (e) { toast('Starred khola jayni.'); }
}

/* ---------- V4 Clear chat ---------- */
async function v4ClearChat() {
  try {
    const chatId = state.activeId;
    if (!chatId) { toast('Age ekta chat khulun.'); return; }
    if (!confirm('Ei chat er shob message delete hobe. Continue korben?')) return;
    toast('Chat clear hocche...');
    const snap = await getDocs(query(collection(db, 'chats', chatId, 'messages'), orderBy('createdAt'), limitToLast(200)));
    for (const d of snap.docs) { try { await deleteDoc(doc(db, 'chats', chatId, 'messages', d.id)); } catch (e) {} }
    try { await updateDoc(doc(db, 'chats', chatId), { lastMessage: { text: '🧹 Chat cleared', senderId: me.uid }, updatedAt: serverTimestamp() }); } catch (e) {}
    toast('Chat cleared 🧹'); renderMessages();
  } catch (e) { toast('Clear hoyni. Abar try korun.'); }
}

/* ---------- V4 keyboard: composer always above the phone keyboard ---------- */
function v4KeyboardHandler() {
  try {
    const setVh = () => { try { document.documentElement.style.setProperty('--v4-vh', (window.innerHeight / 100) + 'px'); } catch (e) {} };
    setVh();
    const vv = window.visualViewport;
    if (!vv) return;
    if (vv.__v4wired) return;
    vv.__v4wired = true;
    const apply = () => {
      try {
        const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
        const comp = document.querySelector('.composer');
        if (comp) comp.style.paddingBottom = kb > 0 ? (kb + 10) + 'px' : '';
        const msgs = $('#msgs');
        if (msgs) msgs.style.paddingBottom = kb > 0 ? (kb + 24) + 'px' : '';
      } catch (e) {}
    };
    vv.addEventListener('resize', apply);
    vv.addEventListener('scroll', apply);
  } catch (e) {}
}

/* ---------------- boot ---------------- */
onAuthStateChanged(auth, async (u) => {
  stopAll();
  me = u;
  if (!u) { try { adminVerified = false; adminCheckedUid = null; } catch (e) {} showLogin(); return; }
  try { if (v4NeedsAppLock()) { v4ShowAppLock(() => { v4AfterUnlock(u); }); return; } } catch (e) {}
  v4AfterUnlock(u);
});

async function v4AfterUnlock(u) {
  try { showChat(); } catch (e) {}
  try { renderAdminButton(); } catch (e) {}
  try {
    const uref = doc(db, 'users', u.uid);
    const snap = await getDoc(uref);
    const base = { uid: u.uid, email: u.email || '' };
    if (!v4GhostModeOn()) base.lastSeen = serverTimestamp();
    if (!snap.exists() || !snap.data().customPhoto) base.photoURL = u.photoURL || '';
    if (!snap.exists() || !snap.data().name) base.name = u.displayName || (u.email ? u.email.split('@')[0] : 'User');
    await setDoc(uref, base, { merge: true });
  } catch (e) {
    console.error('Profile save failed:', e);
    toast('Profile save hoyni. Firestore rules publish korechen kina check korun.');
  }
}
